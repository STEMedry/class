<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Circuit Learning Studio — Computational Thinking Edition</title>
  <style>
    :root{
      --bg:#f5f7fb;--panel:#ffffff;--line:#d7deea;--text:#1f2937;
      --muted:#64748b;--blue:#3b82f6;--blue2:#2563eb;--green:#16a34a;
      --red:#dc2626;--orange:#f59e0b;--purple:#7c3aed;
      --shadow:0 10px 30px rgba(15,23,42,.12);--radius:16px;
      --toolbar-h:68px;--left-w:310px;--canvas-bg:#eef2f7;
      --btn-font:12px;--btn-pad-y:8px;--btn-pad-x:10px;--place-scale:0.5;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      touch-action:none;
    }
    .app{display:grid;grid-template-rows:var(--toolbar-h) 1fr;height:100vh;height:100dvh;width:100vw}
    .toolbar{
      display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;
      border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);
      z-index:10;min-width:0;overflow:hidden;flex-wrap:nowrap;
    }
    .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:nowrap;overflow:hidden}
    .brand{display:flex;align-items:center;gap:8px;margin-right:6px;padding-right:8px;border-right:1px solid var(--line);flex:0 0 auto;min-width:0}
    .brand-badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#eff6ff);color:var(--blue2);font-size:18px;flex:0 0 auto}
    .brand-title{font-weight:800;font-size:14px;line-height:1.05;white-space:nowrap}
    .brand-subtitle{font-size:11px;color:var(--muted);line-height:1.05;margin-top:2px;white-space:nowrap}
    .btn,.select{
      border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;
      padding:var(--btn-pad-y) var(--btn-pad-x);font-size:var(--btn-font);font-weight:700;
      cursor:pointer;transition:.16s ease;white-space:nowrap;touch-action:manipulation;line-height:1;flex:0 0 auto;
    }
    .btn:hover,.select:hover{transform:translateY(-1px);border-color:#b7c5dd;background:#fcfdff}
    .btn.primary{background:linear-gradient(180deg,#4f8fff 0%,#3b82f6 100%);color:#fff;border-color:#3b82f6}
    .btn.ghost{background:#f8fbff}
    .btn.toggle-active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);color:var(--blue2);background:#f4f8ff}
    .workspace{display:grid;grid-template-columns:var(--left-w) 1fr;min-width:0;min-height:0}
    .sidebar{border-right:1px solid var(--line);background:linear-gradient(180deg,#fff 0%,#f7faff 100%);padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
    .panel h3{margin:0 0 10px;font-size:14px}
    .panel p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
    .parts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .part{border:1px dashed #c8d5e8;background:#fbfdff;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:.16s ease;user-select:none;touch-action:manipulation}
    .part:hover{border-color:#91b5ff;background:#f4f8ff;transform:translateY(-1px)}
    .part.active{border-style:solid;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);background:#f4f8ff}
    .part .icon{font-size:22px;line-height:1;margin-bottom:6px}
    .part .name{font-size:12px;font-weight:700}
    .part .small{font-size:11px;color:var(--muted);margin-top:4px}
    .hint-list{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.5}
    .main{position:relative;min-width:0;min-height:0;background:#eef2f7;overflow:hidden}
    .canvas-wrap{position:absolute;inset:0;overflow:hidden;touch-action:none}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default;background:var(--canvas-bg)}
    .statusbar{position:absolute;left:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;z-index:2;pointer-events:none}
    .status-pill{background:rgba(255,255,255,.94);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow)}
    .status-pill.complete{color:#166534;border-color:#86efac;background:rgba(240,253,244,.96);font-weight:800}
    .status-pill.open{color:#1d4ed8;border-color:#93c5fd;background:rgba(239,246,255,.96);font-weight:800}
    .status-pill.short{color:#991b1b;border-color:#fca5a5;background:rgba(254,242,242,.97);font-weight:800}
    .overlay-card{
      position:absolute;top:16px;right:16px;z-index:5;width:min(900px,calc(100vw - 32px));
      max-height:min(85vh,900px);overflow:auto;-webkit-overflow-scrolling:touch;
      background:rgba(255,255,255,.99);border:1px solid #d9e2f1;border-radius:20px;
      box-shadow:0 24px 64px rgba(15,23,42,.18);padding:18px 20px 20px;display:none;
    }
    .overlay-card.show{display:block}
    .overlay-card h4{margin:0 0 10px;font-size:18px}
    .overlay-card p,.overlay-card li{font-size:13px;line-height:1.65;color:#475569}
    .overlay-card ul,.overlay-card ol{padding-left:18px;margin:8px 0 0}
    .overlay-close{float:right;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:13px;margin-left:10px}
    .formula{background:#f8fbff;border:1px solid #dbe6f5;border-radius:12px;padding:10px 12px;margin:10px 0;color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;white-space:pre-wrap}
    .explain-hero{border:1px solid #dbe6f5;background:linear-gradient(180deg,#f8fbff 0%,#eef5ff 100%);border-radius:16px;padding:14px;margin-bottom:14px}
    .explain-hero h5{margin:0 0 8px;font-size:15px;color:#1e3a8a}
    .explain-hero p{margin:0;color:#475569}
    .explain-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
    .summary-box{border:1px solid #dbe6f5;background:#fff;border-radius:14px;padding:10px 12px}
    .summary-box .k{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#64748b;margin-bottom:6px}
    .summary-box .v{font-size:18px;font-weight:800;color:#0f172a}
    .summary-box .s{margin-top:4px;font-size:12px;color:#64748b}
    .explain-step{border:1px solid #e3ebf7;border-radius:16px;background:#fff;padding:14px;margin-top:12px}
    .explain-step-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
    .step-badge{display:inline-grid;place-items:center;min-width:88px;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:900;color:#fff;letter-spacing:.02em}
    .step-blue{background:#2563eb}.step-green{background:#16a34a}.step-orange{background:#ea580c}
    .step-purple{background:#7c3aed}.step-red{background:#dc2626}.step-indigo{background:#4f46e5}
    .explain-step h5{margin:0;font-size:15px;color:#1f2937}
    .explain-note{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-top:8px;color:#475569;font-size:13px;line-height:1.6}
    .detail-table{width:100%;border-collapse:collapse;margin-top:10px;overflow:hidden;border-radius:12px;font-size:13px}
    .detail-table th,.detail-table td{border:1px solid #dbe6f5;padding:10px;text-align:left;vertical-align:top}
    .detail-table th{background:#eff6ff;color:#1e3a8a;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
    .modal-backdrop.show{display:flex}
    .modal{width:min(1120px,100%);max-height:min(92vh,920px);overflow:auto;background:#fff;border-radius:20px;border:1px solid #d9e2f1;box-shadow:0 24px 64px rgba(15,23,42,.24);display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
    .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);position:sticky;top:0;z-index:1}
    .modal-title{font-size:18px;font-weight:800;margin:0}
    .modal-close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}
    .modal-body{padding:18px}
    .section{background:#fbfdff;border:1px solid #e1e9f6;border-radius:14px;padding:14px;margin-bottom:12px}
    .section h5{margin:0 0 8px;font-size:14px}
    .section p,.section li{color:#475569;font-size:14px;line-height:1.6}
    .section ul,.section ol{margin:8px 0 0;padding-left:18px}
    .tutorial-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:stretch}
    .tutorial-diagram{border:1px solid #dbe6f5;border-radius:16px;background:linear-gradient(180deg,#f8fbff 0%,#eef5ff 100%);padding:14px;min-height:220px;display:flex;align-items:center;justify-content:center}
    .tutorial-diagram svg{width:100%;max-width:460px;height:auto}
    .tutorial-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .mini-card{border:1px solid #dbe6f5;border-radius:14px;padding:12px;background:#fff}
    .mini-card h6{margin:0 0 6px;font-size:13px}
    .mini-card p{margin:0;font-size:13px;color:#64748b;line-height:1.5}
    .tutorial-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
    .tutorial-page-indicator{font-size:13px;color:var(--muted)}
    .tutorial-buttons{display:flex;gap:8px}
    .credit-badge{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:10px;background:rgba(15,23,42,.62);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;box-shadow:0 18px 40px rgba(15,23,42,.22);backdrop-filter:blur(6px);text-decoration:none}
    .credit-badge:hover{background:rgba(15,23,42,.72)}
    .credit-badge img{height:42px;width:auto;object-fit:contain;display:block;flex:0 0 auto}
    .credit-text{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.1}
    .credit-main{font-family:"Arial Black",Arial,Helvetica,sans-serif;font-weight:900;color:#fff;font-size:16px;white-space:nowrap}
    .credit-sub{color:rgba(255,255,255,.92);font-size:11px;margin-top:4px;white-space:nowrap}
    .tutorial-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
    .tutorial-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
    .pillar-card{border:1px solid #dbe6f5;border-radius:16px;padding:14px;background:#fff;min-height:180px}
    .pillar-card h6{margin:0 0 8px;font-size:14px}
    .pillar-card .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:5px 9px;margin-bottom:8px;color:#fff}
    .tag.blue{background:#2563eb}.tag.green{background:#16a34a}.tag.orange{background:#ea580c}.tag.purple{background:#7c3aed}
    .ct-flow{border:1px solid #dbe6f5;border-radius:16px;background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);padding:14px;margin-top:10px}
    .ct-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
    .ct-step{border:1px solid #dbe6f5;border-radius:14px;background:#fff;padding:10px;min-height:120px}
    .ct-step-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800;margin-bottom:8px}
    .ct-step h6{margin:0 0 6px;font-size:13px}
    .ct-step p{margin:0;font-size:12px;line-height:1.5;color:#64748b}
    .compare-table{width:100%;border-collapse:collapse;margin-top:10px;overflow:hidden;border-radius:12px;font-size:13px}
    .compare-table th,.compare-table td{border:1px solid #dbe6f5;padding:10px;text-align:left;vertical-align:top}
    .compare-table th{background:#eff6ff;color:#1e3a8a;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    .strategy-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
    .strategy-box{border-radius:14px;padding:12px;border:1px solid #dbe6f5;background:#fff}
    .strategy-box strong{display:block;margin-bottom:6px;font-size:13px}
    .strategy-box p{margin:0;font-size:12px;color:#64748b;line-height:1.5}

    #meterExplainCard{touch-action:pan-y}
    #meterExplainBody .reading-step{
      padding:22px 0;border-bottom:1px solid #d7deea;
    }
    #meterExplainBody .reading-step:last-child{border-bottom:0}
    #meterExplainBody .reading-step h5{
      margin:0 0 14px;font-size:19px;font-weight:750;line-height:1.45;color:#18202c;
    }
    #meterExplainBody .reading-step p,
    #meterExplainBody .reading-step li{
      font-size:15px;line-height:1.8;color:#414852;
    }
    #meterExplainBody .reading-step p{margin:10px 0}
    #meterExplainBody .reading-step li{margin:10px 0}
    #meterExplainBody .math-line{
      padding:15px 8px;margin:12px 0;text-align:center;
      font-family:Cambria,"Times New Roman",serif;
      font-size:21px;line-height:2;color:#18202c;
      overflow-x:auto;touch-action:pan-x;overflow-wrap:anywhere;
    }
    #meterExplainBody .math-line sub{font-size:.68em}
    #meterExplainBody .math-line strong{font-weight:800}
    #meterExplainBody .math-frac{
      display:inline-flex;flex-direction:column;vertical-align:middle;
      text-align:center;line-height:1.4;margin:0 .22em;
    }
    #meterExplainBody .math-frac>span:first-child{
      border-bottom:1px solid currentColor;padding:0 .25em .1em;
    }
    #meterExplainBody .math-frac>span:last-child{padding:.1em .25em 0}
    #meterExplainBody .reading-subsection{
      margin:14px 0;padding:12px 14px;background:#fafcff;
      border:1px solid #e2e8f0;border-radius:12px;
    }
    #meterExplainBody .reading-subsection h6{margin:0 0 8px;font-size:15px}
    #meterExplainBody .reading-warning{
      border:1px solid #fcd34d;background:#fffbeb;border-radius:12px;
      padding:12px 14px;margin:12px 0;color:#854d0e;font-size:13px;line-height:1.7;
    }
    #meterExplainBody .table-scroll{overflow-x:auto;touch-action:pan-x}
    #meterExplainBody .detail-table td{font-variant-numeric:tabular-nums}
    #meterExplainBody .selected-meter-row{background:#eff6ff;font-weight:700}
    @media (max-width:1220px){
      :root{--btn-font:11px;--btn-pad-y:7px;--btn-pad-x:8px}
      .brand-title{font-size:13px}.brand-subtitle{font-size:10px}
    }
    @media (max-width:1060px){
      .workspace{grid-template-columns:1fr}.sidebar{display:none}
      .tutorial-grid-4,.ct-steps,.strategy-strip,.explain-summary-grid{grid-template-columns:1fr 1fr}
    }
    @media (max-width:760px){
      .toolbar{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
      .tutorial-hero,.tutorial-grid-2,.tutorial-grid-4,.ct-steps,.strategy-strip,.explain-summary-grid{grid-template-columns:1fr}
      .tutorial-cards{grid-template-columns:1fr}
      .credit-badge{right:10px;bottom:10px;padding:8px 10px}
      .credit-badge img{height:36px}.credit-main{font-size:13px}.credit-sub{font-size:10px}
      #meterExplainBody .reading-step h5{font-size:17px}
      #meterExplainBody .math-line{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="brand">
          <div class="brand-badge">⚡</div>
          <div>
            <div class="brand-title" id="brandTitle">Circuit Learning Studio</div>
            <div class="brand-subtitle" id="brandSubtitle">Computational Thinking Edition</div>
          </div>
        </div>
        <button class="btn" id="selectModeBtn"></button>
        <button class="btn" id="panModeBtn"></button>
        <button class="btn" id="rotateLeftBtn"></button>
        <button class="btn" id="rotateRightBtn"></button>
        <button class="btn" id="rotateCircuitBtn"></button>
        <button class="btn" id="undoBtn"></button>
        <button class="btn" id="deleteBtn"></button>
        <button class="btn" id="clearBtn"></button>
        <button class="btn" id="saveProjectBtn"></button>
        <button class="btn" id="loadProjectBtn"></button>
        <button class="btn" id="exportJpegBtn"></button>
      </div>
      <div class="toolbar-right">
        <button class="btn ghost" id="tutorialBtn"></button>
        <button class="btn ghost" id="languageBtn"></button>
      </div>
    </div>
    <div class="workspace">
      <aside class="sidebar">
        <div class="panel"><h3 id="partsTitle"></h3><div class="parts" id="partsGrid"></div></div>
        <div class="panel">
          <h3 id="guideTitle"></h3><p id="guideIntro"></p><ul class="hint-list" id="guideList"></ul>
        </div>
        <div class="panel"><h3 id="notesTitle"></h3><p id="notesBody"></p></div>
      </aside>
      <main class="main">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas"></canvas>
          <div class="overlay-card" id="meterExplainCard">
            <button class="overlay-close" id="meterExplainClose">✕</button>
            <h4 id="meterExplainTitle"></h4>
            <div id="meterExplainBody"></div>
          </div>
          <div class="statusbar">
            <div class="status-pill" id="modeStatus"></div>
            <div class="status-pill" id="circuitStatus"></div>
            <div class="status-pill" id="zoomStatus"></div>
          </div>
          <a class="credit-badge"
             href="https://repository.eduhk.hk/en/persons/chung-yiu-richard%E6%A5%8A%E4%BB%B2%E5%A0%AF-yeung/"
             target="_blank" rel="noopener noreferrer">
            <img src="EdUHK.png" alt="EdUHK" />
            <div class="credit-text">
              <div class="credit-main">Richard C. Y. YEUNG, EdUHK</div>
              <div class="credit-sub">Academy for Education Development and Innovation</div>
            </div>
          </a>
        </div>
      </main>
    </div>
  </div>
  <input type="file" id="projectFileInput" accept=".json,application/json" style="display:none" />
  <div class="modal-backdrop" id="tutorialModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tutorialModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="tutorialModalTitle"></h2>
        <button class="modal-close" id="tutorialModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="section"><h5 id="tutorialPageTitle"></h5><div id="tutorialPageBody"></div></div>
        <div class="tutorial-controls">
          <div class="tutorial-page-indicator" id="tutorialPageIndicator"></div>
          <div class="tutorial-buttons">
            <button class="btn" id="tutorialPrevBtn"></button>
            <button class="btn primary" id="tutorialNextBtn"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const GRID = 32;
      const OPEN_RESISTANCE = 1e12;
      const IDEAL_WIRE_RESISTANCE = 1e-7;
      const AMMETER_RESISTANCE = 1e-5;
      const VOLTMETER_RESISTANCE = 1e12;
      const SOLVER_EPS = 1e-10;
      const HIT_R = 72;
      const TERM_R = 14;
      const CLICK_DRAG_THRESHOLD = 4;
      const DEFAULT_BATTERY_VOLTAGE = 1.5;
      const DEFAULT_BULB_RESISTANCE = 20;
      const DEFAULT_RESISTOR_RESISTANCE = 10;
      const ROTATE_STEP = 15;
      const PROJECT_FILE_VERSION = 9;
      const PLACE_SCALE = 0.5;
      const SHORT_CURRENT_THRESHOLD = 5;
      const LABEL_HIT_PAD = 8;

      const I18N = {
        en: {
          brandTitle:"Circuit Learning Studio",
          brandSubtitle:"Computational Thinking Edition",
          selectMode:"Select / Move",panMode:"Pan View",
          rotateLeft:"Rotate -15°",rotateRight:"Rotate +15°",
          rotateCircuit:"Rotate Circuit",undo:"Undo",delete:"Delete",clear:"Clear",
          saveProject:"Save",loadProject:"Load",exportJpeg:"JPEG",
          tutorial:"Tutorial",language:"中文",partsTitle:"Component Palette",
          guideTitle:"Quick Guide",guideIntro:"Build, test, compare, revise, and explain.",
          guideList:[
            "Choose components or Wire from the Component Palette.",
            "Choose Node, then click any wire position to insert a conducting node.",
            "After inserting a Node in the middle of a wire, you can connect new wires/components to that node."
          ],
          notesTitle:"Physics Notes",
          notesBody:"The simulator uses DC nodal analysis and supports batteries, bulbs, resistors, switches, meters, buzzers, fans, wires, and conducting nodes inserted on wires.",
          modeSelect:"Mode: Select / Move",modeWireStatus:"Mode: Wire",modePan:"Mode: Pan View",
          completeCircuit:"Complete Circuit",openCircuit:"Open Circuit",shortCircuit:"Short Circuit",
          zoomLabel:z=>`Zoom: ${Math.round(z*100)}%`,
          tutorialModalTitle:"Tutorial",tutorialPrev:"Previous",tutorialNext:"Next",tutorialDone:"Done",
          meterExplainTitleA:"Ammeter Reading Explanation",
          meterExplainTitleV:"Voltmeter Reading Explanation",
          noConductingExplain:"This explanation appears only when the circuit is solved and the meter is in a meaningful electrical path.",
          explainHeroA:"Detailed step-by-step current calculation",

      function readingSolveLinear(A,b){

        const M=A.map((row,i)=>{
          const scale=Math.max(...row.map(Math.abs));
          return scale>0?[...row.map(v=>v/scale),b[i]/scale]:[...row,b[i]];
        });

          if(Math.abs(M[pivot][col])<1e-14)return null;

      function readingTopology(){

      }

      function readingConductive(e){
        return e.component.type!=="voltmeter"&&
          !(e.component.type==="switch"&&!e.component.closed);
      }

      function readingIsland(edges,start){
        const nodes=new Set([start]),queue=[start];
        for(let i=0;i<queue.length;i++){
          const node=queue[i];
          for(const e of edges){
            if(!readingConductive(e))continue;
            if(e.a!==node&&e.b!==node)continue;
            const other=e.a===node?e.b:e.a;
            if(!nodes.has(other)){nodes.add(other);queue.push(other)}
          }
        }
        return nodes;
      }

      function readingMNA(nodes,resistors,sources,ground){
        const unknown=[...nodes].filter(n=>n!==ground),map=new Map(unknown.map((n,i)=>[n,i]));
        const nv=unknown.length,size=nv+sources.length;
        const A=Array.from({length:size},()=>Array(size).fill(0)),rhs=Array(size).fill(0);
        for(const e of resistors){
          if(e.a===e.b)continue;
          const g=1/e.r,ia=map.get(e.a),ib=map.get(e.b);
          if(ia!=null)A[ia][ia]+=g;
          if(ib!=null)A[ib][ib]+=g;
          if(ia!=null&&ib!=null){A[ia][ib]-=g;A[ib][ia]-=g}
        }
        sources.forEach((e,k)=>{
          const row=nv+k,ia=map.get(e.a),ib=map.get(e.b);
          if(ia!=null){A[ia][row]+=1;A[row][ia]+=1}
          if(ib!=null){A[ib][row]-=1;A[row][ib]-=1}
          rhs[row]=e.v;
        });
        const solution=readingSolveLinear(A,rhs);
        if(!solution)return null;
        const voltages=new Map([[ground,0]]),currents=new Map();
        unknown.forEach((n,i)=>voltages.set(n,solution[i]));
        for(const e of resistors)currents.set(e.id,((voltages.get(e.a)||0)-(voltages.get(e.b)||0))/e.r);
        sources.forEach((e,k)=>currents.set(e.id,solution[nv+k]));
        return {voltages,currents,ground};
      }

      function readingSourcePort(sources,resistors){
        if(sources.length===1){
          const s=sources[0];
          return {a:s.a,b:s.b,v:s.v,terms:[{edge:s,sign:1}]};
        }
        const incident=new Map();
        for(const s of sources){
          for(const n of [s.a,s.b]){
            if(!incident.has(n))incident.set(n,[]);
            incident.get(n).push(s);
          }
        }
        const ends=[...incident.keys()].filter(n=>incident.get(n).length===1);
        if(ends.length!==2||[...incident.values()].some(list=>list.length>2))return null;
        for(const [n,list]of incident){
          if(list.length===2&&resistors.some(e=>e.a===n||e.b===n))return null;
        }
        let node=ends[0],v=0;
        const used=new Set(),terms=[];
        while(node!==ends[1]){
          const s=(incident.get(node)||[]).find(e=>!used.has(e.id));
          if(!s)return null;
          const sign=s.a===node?1:-1;
          v+=sign*s.v;terms.push({edge:s,sign});used.add(s.id);
          node=s.a===node?s.b:s.a;
        }
        if(used.size!==sources.length)return null;
        return {a:ends[0],b:ends[1],v,terms};
      }

      function readingEquivalent(resistors,a,b){
        if(a===b)return 0;
        const nodes=readingIsland(resistors,a);
        if(!nodes.has(b))return Infinity;
        const relevant=resistors.filter(e=>nodes.has(e.a)&&nodes.has(e.b));
        const test=readingMNA(nodes,relevant,[{id:"reading_test",a,b,v:1}],b);
        if(!test)return null;
        const current=Math.abs(test.currents.get("reading_test")||0);
        return current>1e-15?1/current:Infinity;
      }

      function readingReduce(resistors,a,b){
        let edges=resistors.filter(e=>e.a!==e.b).map(e=>({
          a:e.a,b:e.b,r:e.r,kind:"leaf",component:e.component,children:[],ids:new Set([e.id])
        }));
        const operations=[],discarded=[];
        function combine(kind,list,x,y){
          let children=[];
          for(const e of list){
            if(e.kind===kind)children.push(...e.children);
            else children.push(e);
          }
          const r=kind==="series"?children.reduce((s,e)=>s+e.r,0):
            1/children.reduce((s,e)=>s+1/e.r,0);
          const edge={a:x,b:y,r,kind,children,ids:new Set(children.flatMap(e=>[...e.ids]))};
          operations.push(edge);
          return edge;
        }
        for(let pass=0;pass<Math.max(10,resistors.length*4);pass++){
          let changed=false;
          const pairs=new Map();
          for(const e of edges){
            const key=[e.a,e.b].sort((x,y)=>x-y).join("|");
            if(!pairs.has(key))pairs.set(key,[]);
            pairs.get(key).push(e);
          }
          for(const list of pairs.values()){
            if(list.length<2)continue;
            const replacement=combine("parallel",list,list[0].a,list[0].b);
            const removed=new Set(list);edges=edges.filter(e=>!removed.has(e));edges.push(replacement);
            changed=true;break;
          }
          if(changed)continue;
          const nodes=[...new Set(edges.flatMap(e=>[e.a,e.b]))];
          for(const n of nodes){
            if(n===a||n===b)continue;
            const list=edges.filter(e=>e.a===n||e.b===n);
            if(list.length===1){
              discarded.push(list[0]);edges=edges.filter(e=>e!==list[0]);changed=true;break;
            }
            if(list.length===2){
              const x=list[0].a===n?list[0].b:list[0].a;
              const y=list[1].a===n?list[1].b:list[1].a;
              if(x===y)continue;
              const replacement=combine("series",list,x,y);
              edges=edges.filter(e=>e!==list[0]&&e!==list[1]);edges.push(replacement);
              changed=true;break;
            }
          }
          if(!changed)break;
        }
        const root=edges.length===1&&
          ((edges[0].a===a&&edges[0].b===b)||(edges[0].a===b&&edges[0].b===a))?edges[0]:null;
        return {root,operations,discarded,remaining:edges};
      }

      function readingLeaves(tree){
        if(tree.kind==="leaf")return [tree.component];
        return tree.children.flatMap(readingLeaves);
      }
      function readingTreeNames(tree){
        return readingLeaves(tree).map(componentShortName).join(" + ");
      }
      function readingAssignNames(root){
        let p=0;
        function visit(e){
          if(e.kind==="parallel")e.label="P"+(++p);
          for(const child of e.children)visit(child);
        }
        if(root)visit(root);
      }
      function readingTreeSymbol(e){
        if(e.kind==="leaf")return readingVar("R",componentShortName(e.component));
        if(e.kind==="parallel")return readingVar("R",e.label||"parallel");
        return "("+e.children.map(readingTreeSymbol).join(" + ")+")";
      }
      function readingPostorder(e){
        return [...e.children.flatMap(readingPostorder),e];
      }
      function readingTreePredictions(root,voltage){
        const results=new Map();
        function distribute(e,v){
          const i=v/e.r;results.set(e,{v,i});
          if(e.kind==="series"){
            for(const child of e.children)distribute(child,i*child.r);
          }else if(e.kind==="parallel"){
            for(const child of e.children)distribute(child,v);
          }
        }
        distribute(root,Math.abs(voltage));return results;
      }

      function readingBuildModel(c){
        const topology=readingTopology(),meter=topology.edges.find(e=>e.id===c.id);
        if(!meter)return {error:readingText("The meter has no valid terminal pair.","儀表沒有有效的兩端節點。")};
        const nodes=readingIsland(topology.edges,meter.a);
        if(!nodes.has(meter.b)){
          return {error:readingText(
            "The two meter terminals are in different electrically isolated networks. There is no defined common voltage reference or conducting measurement path.",
            "儀表兩端位於不同且互相隔離的電路，沒有共同電位基準或可導通的量測路徑。"
          )};
        }
        const relevant=topology.edges.filter(e=>nodes.has(e.a)&&nodes.has(e.b));
        const sources=relevant.filter(e=>e.component.type==="battery");
        const resistors=relevant.filter(e=>readingConductive(e)&&e.component.type!=="battery");
        if(!sources.length)return {error:readingText("No battery supplies this meter's network.","此儀表所在的電路沒有電池供電。")};
        const prediction=readingMNA(nodes,resistors,sources,sources[0].b);
        if(!prediction)return {error:readingText(
          "The source constraints cannot be solved uniquely. Check for a battery short circuit, contradictory ideal voltage sources, or invalid connections.",
          "電源條件無法得到唯一解。請檢查電池短路、互相矛盾的理想電壓源或無效連接。"
        )};
        const port=readingSourcePort(sources,resistors);
        const reduction=port?readingReduce(resistors,port.a,port.b):null;
        const root=reduction?.root||null;
        if(root)readingAssignNames(root);
        const equivalent=port?(root?root.r:readingEquivalent(resistors,port.a,port.b)):null;
        const totalI=port&&equivalent!=null?(equivalent===Infinity?0:Math.abs(port.v)/equivalent):null;
        const treeResults=root?readingTreePredictions(root,port.v):null;
        const predictedReading=c.type==="ammeter"?Math.abs(prediction.currents.get(c.id)||0):
          Math.abs((prediction.voltages.get(meter.a)||0)-(prediction.voltages.get(meter.b)||0));
        return {meter,nodes,relevant,sources,resistors,prediction,port,reduction,root,equivalent,totalI,treeResults,predictedReading};
      }

      function readingParallelStep(model){
        const {root}=model;
        if(!root){
          const rows=model.resistors.filter(e=>!["ammeter","switch"].includes(e.component.type)).map(e=>
            `<tr><td>${componentShortName(e.component)}</td><td>N${e.a+1} ↔ N${e.b+1}</td><td>${readingNumber(e.r)} Ω</td></tr>`
          );
          return `<p>${readingText(
            "First, list the resistances and node connections. This network cannot be represented as one verified series–parallel reduction, or it has independent source connections. We therefore use Kirchhoff’s laws rather than incorrectly adding unrelated branches.",
            "先列出電阻與節點連接。此電路不能完全化簡成單一、經驗證的串並聯結構，或含有獨立電源連接，因此使用基爾霍夫定律，避免把不相關支路錯誤相加。"
          )}</p>${readingTable([
            readingText("Component","元件"),readingText("Connected nodes","連接節點"),readingText("Resistance","電阻")
          ],rows)}`;
        }
        const parallels=readingPostorder(root).filter(e=>e.kind==="parallel");
        if(!parallels.length){
          return `<p>${readingText(
            "There is no parallel section in this conducting path. All loads in the reduced main path are in series.",
            "此導通路徑沒有並聯部分，化簡後的主路徑負載全部串聯。"
          )}</p>${readingMath(
            readingVar("R","series")+" = "+
            readingLeaves(root).map(c=>readingVar("R",componentShortName(c))).join(" + ")+
            " = "+readingLeaves(root).map(c=>readingNumber(readingR({component:c}))+" Ω").join(" + ")+
            " ≈ <strong>"+readingNumber(root.r,4)+" Ω</strong>"
          )}`;
        }
        let html=`<p>${readingText(
          "First, identify parallel paths by their common start and end nodes. Add series resistances within each path, then combine the parallel branches. For nested networks, simplify the innermost parallel section first.",
          "先根據共同的起點與終點辨認並聯路徑，把每條支路內的串聯電阻相加，再合併並聯支路。若有巢狀結構，先化簡最內層並聯部分。"
        )}</p>`;
        for(const p of parallels){
          html+=`<div class="reading-subsection"><h6>${readingText("Parallel section","並聯部分")} ${p.label}</h6><ul>`;
          p.children.forEach((branch,i)=>{
            const branchName=`${p.label}.${i+1}`;
            html+=`<li><strong>${t("branchLabel")(i+1)} (${readingTreeNames(branch)}):</strong> ${
              readingText(
                branch.kind==="series"?"These elements are in series, so their equivalent resistances add.":"Use the component resistance or the equivalent resistance already calculated for this subnetwork.",
                branch.kind==="series"?"這些部分串聯，因此把它們的等效電阻相加。":"使用此元件的電阻，或此子電路已求得的等效電阻。"
              )
            }${readingMath(
              readingVar("R",branchName)+" = "+readingTreeSymbol(branch)+" = "+
              (branch.kind==="series"?branch.children.map(ch=>readingNumber(ch.r)+" Ω").join(" + "):readingNumber(branch.r)+" Ω")+
              " ≈ <strong>"+readingNumber(branch.r,4)+" Ω</strong>"
            )}</li>`;
          });
          html+=`</ul><p>${readingText(
            "Now combine these parallel branches into a single equivalent resistance:",
            "現在把這些並聯支路合併成單一等效電阻："
          )}</p>`;
          html+=readingMath(
            readingFrac("1",readingVar("R",p.label))+" = "+
            p.children.map((b,i)=>readingFrac("1",readingVar("R",p.label+"."+(i+1)))).join(" + ")+
            " = "+p.children.map(b=>readingFrac("1",readingNumber(b.r))).join(" + ")
          );
          html+=readingMath(
            readingVar("R",p.label)+" = "+
            readingFrac("1",p.children.map(b=>readingFrac("1",readingNumber(b.r))).join(" + "))+
            " ≈ <strong>"+readingNumber(p.r,4)+" Ω</strong>"
          )+"</div>";
        }
        return html;
      }

      function readingTotalResistanceStep(model){
        const {root,port,equivalent}=model;
        if(!port){
          return `<p>${readingText(
            "The sources are not a single untapped series battery chain. A single “total resistance” and a summed battery voltage would be misleading. Each source sees its own driving-point resistance.",
            "電源並非單一、無分支接點的串聯電池組，因此不能直接把所有電池電壓相加或指定一個總電阻。各電源具有各自所見的輸入等效電阻。"
          )}</p>${readingMath(
            readingVar("R","in,k")+" = "+readingFrac(readingVar("V","test"),readingVar("I","test"))+
            readingText(" &nbsp; (other independent voltage sources set to 0 V)"," &nbsp;（其他獨立電壓源設為 0 V）")
          )}<p>${readingText(
            "The simultaneous source-and-node calculation in Steps 3–4 predicts the actual currents and voltages without inventing a global series–parallel structure.",
            "步驟 3–4 同時求解各電源與節點，準確預測電流和電壓，而不虛構整體串並聯結構。"
          )}</p>`;
        }
        if(equivalent===Infinity){
          return `<p>${readingText(
            "There is no closed resistive return path between the source terminals. An open switch or disconnected branch breaks the circuit.",
            "電源兩端之間沒有閉合的電阻回路，可能由未閉合開關或斷開支路造成。"
          )}</p>${readingMath(readingVar("R","total")+" = ∞ Ω")}`;
        }
        if(root){
          const parts=root.kind==="series"?root.children:[root];
          return `<p>${readingText(
            root.kind==="series"?
              "The reduced parallel sections and the remaining series elements are in series. Add their equivalent resistances to find the total circuit resistance:":
              "The reduced network spans the two source terminals, so its equivalent resistance is the total circuit resistance:",
            root.kind==="series"?
              "化簡後的並聯部分與其餘元件串聯，把它們的等效電阻相加，得到全電路總電阻：":
              "化簡後的電路跨接電源兩端，因此其等效電阻就是全電路總電阻："
          )}</p>${readingMath(
            readingVar("R","total")+" = "+parts.map(readingTreeSymbol).join(" + ")+
            " = "+parts.map(e=>readingNumber(e.r)+" Ω").join(" + ")+
            " ≈ <strong>"+readingNumber(equivalent,4)+" Ω</strong>"
          )}`;
        }
        return `<p>${readingText(
          "A bridge or other non-reducible network requires nodal analysis. Apply a separate 1 V test source across the source port and solve the resistor network; this calculates resistance independently of the live meter readings.",
          "橋式或其他不能直接串並聯化簡的電路須使用節點分析。另在电源端口施加 1 V 測試電源，求解電阻網絡；此方法不使用現有儀表讀值來反推電阻。"
        )}</p>${readingMath(
          readingVar("R","total")+" = "+readingFrac(readingVar("V","test"),readingVar("I","test"))+
          " = "+readingFrac("1 V",readingNumber(1/equivalent)+" A")+
          " ≈ <strong>"+readingNumber(equivalent,4)+" Ω</strong>"
        )}`;
      }

      function readingSourceVoltageFormula(port){
        return port.terms.map((term,i)=>{
          const sign=term.sign<0?"−":i?" + ":"";
          return sign+readingNumber(term.edge.v)+" V";
        }).join(" ");
      }

      function readingTotalCurrentStep(model){
        let html="";
        if(model.port){
          html+=`<p>${readingText(
            "Combine battery voltages according to their actual series connections and polarities. Then use Ohm’s law to predict the current leaving the source:",
            "根據電池實際串聯連接及極性合併電壓，再使用歐姆定律預測離開電源的總電流："
          )}</p>`;
          html+=readingMath(
            readingVar("V","total")+" = |"+readingSourceVoltageFormula(model.port)+"|"+
            " = <strong>"+readingNumber(Math.abs(model.port.v))+" V</strong>"
          );
          html+=readingMath(
            readingVar("I","total")+" = "+readingFrac(readingVar("V","total"),readingVar("R","total"))+
            " = "+readingFrac(readingNumber(Math.abs(model.port.v))+" V",readingNumber(model.equivalent)+" Ω")+
            " ≈ <strong>"+readingNumber(model.totalI)+" A</strong>"
          );
          if(model.root){
            const mainMeters=readingLeaves(model.root).filter(c=>{
              if(c.type!=="ammeter")return false;
              function belongsToParallel(e){
                if(e.kind==="parallel"&&e.ids.has(c.id))return true;
                return e.children.some(belongsToParallel);
              }
              return !belongsToParallel(model.root);
            });
            if(mainMeters.length){
              html+=`<ul><li>${readingText(
                "Main-path ammeter(s) "+mainMeters.map(componentShortName).join(", ")+" therefore measure the total current.",
                "主路徑電流表 "+mainMeters.map(componentShortName).join("、")+" 因此量度總電流。"
              )}</li></ul>`;
            }
          }
        }else{
          html+=`<p>${readingText(
            "For independent or tapped sources, solve all source constraints together. Battery voltages are not simply added:",
            "對於獨立或有分支接點的電源，須同時求解所有電源條件，不能把電池電壓直接相加："
          )}</p>`;
          for(const s of model.sources){
            html+=readingMath(
              readingVar("V","N"+(s.a+1))+" − "+readingVar("V","N"+(s.b+1))+
              " = "+readingNumber(s.v)+" V"
            );
          }
        }
        if(!model.root){
          html+=`<p>${readingText(
            "At each ordinary node, the algebraic sum of currents is zero. The source constraints and these equations form the simultaneous nodal calculation:",
            "在每個普通節點，流入與流出電流的代數和為零。這些方程與電源條件構成聯立節點方程："
          )}</p>`;
          html+=readingMath("Σ "+readingFrac(
            readingVar("V","i")+" − "+readingVar("V","j"),readingVar("R","ij")
          )+" + Σ "+readingVar("I","source")+" = 0");
        }
        const rows=model.sources.map(s=>`<tr>
          <td>${componentShortName(s.component)}</td>
          <td>${readingNumber(s.v)} V</td>
          <td>${readingNumber(model.prediction.currents.get(s.id)||0)} A</td>
        </tr>`);
        html+=readingTable([
          readingText("Source","電源"),readingText("Source voltage","電源電壓"),
          readingText("Predicted current, left → right","預測電流，左端 → 右端")
        ],rows);
        html+=`<p>${readingText(
          "A negative source current means the battery supplies current opposite to its left-to-right reference direction.",
          "電源電流為負值，表示電池沿與左端到右端參考方向相反的方向供應電流。"
        )}</p>`;
        return html;
      }

      function readingBranchStep(model,c){
        let html=`<p>${readingText(
          "Use the calculated total current to work back through the network. Series elements carry the same current; parallel branches have the same voltage across their common endpoints.",
          "由已求得的總電流逐層回推。串聯元件具有相同電流；並聯支路在共同兩端節點之間具有相同電壓。"
        )}</p>`;
        if(model.root){
          const results=model.treeResults;
          function explain(e){
            if(e.kind==="leaf")return "";
            const result=results.get(e);
            let out="";
            if(e.kind==="series"){
              out+=`<p>${readingText(
                "For the series section ("+readingTreeNames(e)+"), predict each voltage drop:",
                "對串聯部分（"+readingTreeNames(e)+"），預測各部分電壓降："
              )}</p>`;
              for(const child of e.children){
                const cr=results.get(child);
                out+=readingMath(
                  readingVar("V",child.kind==="parallel"?child.label:readingTreeNames(child))+
                  " = "+readingVar("I","series")+" × "+readingTreeSymbol(child)+
                  " = "+readingNumber(result.i)+" × "+readingNumber(child.r)+
                  " ≈ <strong>"+readingNumber(cr.v)+" V</strong>"
                );
              }
            }else{
              out+=`<div class="reading-subsection"><h6>${readingText("Parallel section","並聯部分")} ${e.label}</h6>`;
              out+=readingMath(
                readingVar("V",e.label)+" = "+readingVar("I",e.label)+" × "+readingVar("R",e.label)+
                " = "+readingNumber(result.i)+" × "+readingNumber(e.r)+
                " ≈ <strong>"+readingNumber(result.v)+" V</strong>"
              );
              out+=`<p>${readingText(
                "This voltage is common to every branch in this section. The current divides inversely with branch resistance:",
                "此電壓是此並聯部分各支路的共同電壓，電流按支路電阻的倒數比例分配："
              )}</p>`;
              e.children.forEach((branch,i)=>{
                const br=results.get(branch),name=e.label+"."+(i+1);
                const meters=readingLeaves(branch).filter(x=>x.type==="ammeter").map(componentShortName);
                out+=`<p><strong>${t("branchLabel")(i+1)} (${readingTreeNames(branch)}${meters.length?"; "+meters.join(", "):""}):</strong></p>`;
                out+=readingMath(
                  readingVar("I",name)+" = "+readingFrac(readingVar("V",e.label),readingVar("R",name))+
                  " = "+readingFrac(readingNumber(result.v)+" V",readingNumber(branch.r)+" Ω")+
                  " ≈ <strong>"+readingNumber(br.i)+" A</strong>"
                );
                if(e.children.length===2){
                  const other=e.children[1-i];
                  out+=readingMath(
                    readingVar("I",name)+" = "+readingVar("I",e.label)+" × "+
                    readingFrac(readingVar("R",e.label+"."+(2-i)),
                      readingVar("R",e.label+".1")+" + "+readingVar("R",e.label+".2"))+

          [t("keyTotalResistance"),model.equivalent!=null?readingNumber(model.equivalent)+" Ω":readingText("Port-dependent","取決於電源端口")],
          [t("keyTotalCurrent"),model.totalI!=null?readingNumber(model.totalI)+" A":readingText("Per-source currents","各電源電流")],

          <p>${readingText(
            "Calculate resistance first, then predict total current, branch voltages and branch currents. Calculations use unrounded values; displayed results are rounded.",
            "先計算電阻，再預測總電流、支路電壓及支路電流。計算使用未四捨五入的數值，顯示結果則經四捨五入。"
          )}</p><div class="explain-summary-grid">${

          "Model used for these predictions: ideal wires and ideal voltage sources; the existing 0.00001 Ω ammeter and 0.0000001 Ω closed-switch resistances are included. Voltmeter loading and open-switch leakage are neglected. A battery’s palette resistance is not added, because the existing simulator models batteries as ideal voltage sources. Separate unpowered circuits do not contribute to this meter’s calculation.",
          "本預測模型使用理想導線及理想電壓源，並保留原有電流表的 0.00001 Ω 電阻和閉合開關的 0.0000001 Ω 電阻。忽略電壓表負載與未閉合開關漏電流。由於原有模擬器把電池視為理想電壓源，故不把面板中的電池電阻加入計算。獨立、未供電的電路不參與此儀表的計算。"
        )}</div>`;
        html+=readingStep(1,readingText(

        ),readingParallelStep(model));
        html+=readingStep(2,readingText(

        ),readingTotalResistanceStep(model));
        html+=readingStep(3,readingText(

        ),readingTotalCurrentStep(model));
        html+=readingStep(4,readingText(
          "Predict the Branch Voltages, Branch Currents and Meter Readings","預測支路電壓、支路電流與儀表讀值"
        ),readingBranchStep(model,c));
        return {title,html};
      }

      function hitComponent(world){

      function hitTerminal(world){
        for(let i=state.components.length-1;i>=0;i--){
          const c=state.components[i];
          for(const tt of getTerminals(c,true)){
            if(Math.hypot(world.x-tt.x,world.y-tt.y)<=TERM_R+3)return {componentId:c.id,side:tt.side};
          }
        }
        return null;
      }
      function distancePointToSegment(p,a,b){
        const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
        if(len2===0)return Math.hypot(p.x-a.x,p.y-a.y);
        let tt=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;tt=Math.max(0,Math.min(1,tt));
        const proj={x:a.x+tt*dx,y:a.y+tt*dy};return Math.hypot(p.x-proj.x,p.y-proj.y);
      }
      function hitWire(world){
        for(let i=state.wires.length-1;i>=0;i--){
          const w=state.wires[i],path=w.path||computeWirePath(w.from,w.to,true);
          for(let j=0;j<path.length-1;j++)if(distancePointToSegment(world,path[j],path[j+1])<=10)return w;
        }
        return null;
      }
      function moveSelectedPreviewByWorld(dx,dy){

        }
        let bad=false;
        for(const c of state.components){
          if(movedIds.has(c.id)&&placementOverlaps(c.type,c.x,c.y,movedIds)){bad=true;break}
        }
        if(bad)return false;
        rerouteAllWires(false);return true;
      }
      function resetRenderToLogical(){

      function selectWithinBox(box){
        clearSelection();
        const x1=Math.min(box.x1,box.x2),y1=Math.min(box.y1,box.y2),x2=Math.max(box.x1,box.x2),y2=Math.max(box.y1,box.y2);
        for(const c of state.components){
          const b=componentBounds(c,0,true);
          if(b.x1>=x1&&b.x2<=x2&&b.y1>=y1&&b.y2<=y2)state.selectedComponents.add(c.id);
        }
        for(const w of state.wires){
          const path=w.path||computeWirePath(w.from,w.to,true);
          if(path.every(p=>p.x>=x1&&p.x<=x2&&p.y>=y1&&p.y<=y2))state.selectedWires.add(w.id);

      function deleteSelection(){

        state.wires=state.wires.filter(w=>!wireIds.has(w.id)&&!compIds.has(w.from.componentId)&&!compIds.has(w.to.componentId));
        state.components=state.components.filter(c=>!compIds.has(c.id));

      function requestNumberValue(message, initialValue, fallbackValue){
        const raw=window.prompt(message, String(initialValue));
        if(raw===null)return null;
        const value=Number(String(raw).trim().replace(/[^\d.\-+eE]/g,""));
        if(!Number.isFinite(value) || value<=0)return fallbackValue;
        return value;
      }

          const msg=state.lang==="zhHant"?"請輸入電阻值（Ω）":"Enter resistor value (Ω)";

          if(next==null)return false;

          if(next==null)return false;

      function addComponentAt(type,p){
        const x=snap(p.x),y=snap(p.y);
        if(type==="junction"){
          const near=getNearestWirePoint({x,y},14);
          if(near){
            pushHistory();const node=splitWireAtPoint(near.wire,near.x,near.y);
            if(!node)return false;
            clearSelection();state.selectedComponents.add(node.id);solveAndRender();return true;
          }
        }
        if(placementOverlaps(type,x,y))return false;
        pushHistory();const c=createComponent(type,x,y);state.components.push(c);
        clearSelection();state.selectedComponents.add(c.id);solveAndRender();return true;
      }
      function candidateAnglesFromTerminal(type,anchorRef){
        const c=state.components.find(x=>x.id===anchorRef.componentId);
        if(!c)return [0,180,90,-90];
        const base=c.angle||0;
        if(type==="battery"&&c.type==="battery"){
          if(anchorRef.side==="right")return [base,base+90,base-90,base+180];
          if(anchorRef.side==="left")return [base,base+90,base-90,base+180];
        }
        if(anchorRef.side==="left")return [base+180,base+135,base-135,base+90,base-90,base,base+45,base-45];
        if(anchorRef.side==="right")return [base,base+45,base-45,base+90,base-90,base+180,base+135,base-135];
        return [0,180,90,-90,45,-45,135,-135];
      }
      function findPlacementFromTerminal(type,anchorRef){
        const anchor=getTerminalPosition(anchorRef),angles=candidateAnglesFromTerminal(type,anchorRef),distances=[72,96,128,160,192];
        for(const dist of distances){
          for(const ang0 of angles){
            const ang=normalizeComponentAngle(type,((ang0%360)+360)%360),dir=rotatePoint(dist,0,ang);
            const x=snap(anchor.x+dir.x),y=snap(anchor.y+dir.y);
            if(placementOverlaps(type,x,y))continue;
            const temp=createComponent(type,x,y);temp.angle=ang;temp.renderX=x;temp.renderY=y;
            const terminals=getTerminals(temp);let bestTerminal=null,bestDist=Infinity;
            for(const tt of terminals){
              const d=Math.hypot(tt.x-anchor.x,tt.y-anchor.y);
              if(d<bestDist){bestDist=d;bestTerminal=tt}
            }
            if(!bestTerminal)continue;
            if(type==="battery"&&anchorRef.side==="left"){
              const existing=state.components.find(xx=>xx.id===anchorRef.componentId);
              if(existing&&existing.type==="battery"){
                temp.angle=existing.angle;
                bestTerminal=getTerminals(temp).reduce((acc,tt)=>{
                  const d=Math.hypot(tt.x-anchor.x,tt.y-anchor.y);
                  return !acc||d<acc.d?{...tt,d}:acc;
                },null);
                return {x,y,angle:temp.angle,terminalSide:bestTerminal.side};
              }
            }
            return {x,y,angle:ang,terminalSide:bestTerminal.side};
          }
        }
        return null;
      }
      function addComponentFromExistingTerminal(type,anchorRef){
        const place=findPlacementFromTerminal(type,anchorRef);if(!place)return false;
        pushHistory();const c=createComponent(type,place.x,place.y);
        c.angle=normalizeComponentAngle(c.type,place.angle);c.renderX=c.x;c.renderY=c.y;state.components.push(c);
        addWire(anchorRef,{componentId:c.id,side:place.terminalSide});
        clearSelection();state.selectedComponents.add(c.id);solveAndRender();return true;
      }
      function zoomAt(screenPoint,factor){
        const oldScale=state.view.scale,newScale=Math.max(state.view.minScale,Math.min(state.view.maxScale,oldScale*factor));
        if(newScale===oldScale)return;
        const worldBefore=screenToWorld(screenPoint);state.view.scale=newScale;
        state.view.offsetX=screenPoint.x-worldBefore.x*newScale;state.view.offsetY=screenPoint.y-worldBefore.y*newScale;render();
      }
      function rotateSelected(delta){
        if(!state.selectedComponents.size)return;
        pushHistory();
        for(const c of state.components)if(state.selectedComponents.has(c.id)&&!c.isJunction)c.angle=normalizeComponentAngle(c.type,(c.angle||0)+delta);
        solveAndRender();
      }
      function rotateWholeCircuit(){
        if(!state.components.length)return;
        pushHistory();let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
        for(const c of state.components){
          const b=componentBounds(c,0,false);minX=Math.min(minX,b.x1);minY=Math.min(minY,b.y1);maxX=Math.max(maxX,b.x2);maxY=Math.max(maxY,b.y2);
        }
        const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
        for(const c of state.components){
          const rp=rotatePoint(c.x-cx,c.y-cy,90);c.x=snap(cx+rp.x);c.y=snap(cy+rp.y);c.renderX=c.x;c.renderY=c.y;
          if(!c.isJunction)c.angle=normalizeComponentAngle(c.type,(c.angle||0)+90);
          if(c.labelOffset){
            const lo=rotatePoint(c.labelOffset.x,c.labelOffset.y,90);
            c.labelOffset={x:Math.round(lo.x/4)*4,y:Math.round(lo.y/4)*4};
          }
          if(c.valueLabelOffset){
            const vo=rotatePoint(c.valueLabelOffset.x,c.valueLabelOffset.y,90);
            c.valueLabelOffset={x:Math.round(vo.x/4)*4,y:Math.round(vo.y/4)*4};
          }

        solveAndRender();
      }
      function initAudio(){
        if(!state.audioCtx){
          const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;state.audioCtx=new Ctx();
        }
        if(state.audioCtx.state==="suspended")state.audioCtx.resume();
      }
      function ensureBuzzerSound(c){
        if(!state.audioEnabled)return;
        initAudio();if(!state.audioCtx||state.buzzerOscillators.has(c.id))return;
        const osc=state.audioCtx.createOscillator(),gain=state.audioCtx.createGain(),trem=state.audioCtx.createOscillator(),tremGain=state.audioCtx.createGain();
        osc.type="square";osc.frequency.value=880;gain.gain.value=0.0001;
        trem.type="sine";trem.frequency.value=9;tremGain.gain.value=0.02;
        trem.connect(tremGain);tremGain.connect(gain.gain);osc.connect(gain);gain.connect(state.audioCtx.destination);
        osc.start();trem.start();state.buzzerOscillators.set(c.id,{osc,gain,trem,tremGain});
      }
      function stopBuzzerSound(id){
        const item=state.buzzerOscillators.get(id);if(!item)return;
        try{item.osc.stop()}catch{}try{item.trem.stop()}catch{}try{item.osc.disconnect()}catch{}
        try{item.gain.disconnect()}catch{}try{item.trem.disconnect()}catch{}try{item.tremGain.disconnect()}catch{}
        state.buzzerOscillators.delete(id);
      }
      function stopRemovedBuzzers(){
        const valid=new Set(state.components.filter(c=>c.type==="buzzer").map(c=>c.id));
        for(const id of [...state.buzzerOscillators.keys()])if(!valid.has(id))stopBuzzerSound(id);
      }
      function updateAudio(){
        stopRemovedBuzzers();
        for(const c of state.components){
          if(c.type!=="buzzer")continue;
          const p=normalizedPower(c,0.18);
          if(p>0.01){
            ensureBuzzerSound(c);const item=state.buzzerOscillators.get(c.id);
            if(item){item.osc.frequency.value=650+p*550;item.gain.gain.setTargetAtTime(0.01+p*0.05,state.audioCtx.currentTime,0.03)}
          }else stopBuzzerSound(c.id);
        }
      }

      function updateMeterExplainCard(){
        const card=document.getElementById("meterExplainCard"),title=document.getElementById("meterExplainTitle"),body=document.getElementById("meterExplainBody");
        if(!state.meterExplainTarget){card.classList.remove("show");return}
        const c=state.components.find(x=>x.id===state.meterExplainTarget);
        if(!c||!["ammeter","voltmeter"].includes(c.type)){card.classList.remove("show");return}

        const key=JSON.stringify({
          target:c.id,lang:state.lang,
          components:state.components.map(x=>({
            id:x.id,type:x.type,x:x.x,y:x.y,angle:x.angle,scale:x.scale,
            isJunction:x.isJunction,resistance:x.resistance,
            sourceVoltage:x.sourceVoltage,closed:x.closed,
            current:x.current,voltage:x.voltage
          })),
          wires:state.wires.map(w=>({id:w.id,from:w.from,to:w.to,path:w.path})),
          solved:state.lastPhysics?.solved,
          nodes:state.lastPhysics?.nodeVoltages
        });
        if(key!==readingCacheKey){
          readingCacheKey=key;
          readingCacheInfo=c.type==="ammeter"?getCircuitSummaryForAmmeter(c):getCircuitSummaryForVoltmeter(c);
        }
        if(readingDOMKey!==key){
          readingDOMKey=key;
          const scrollTop=card.scrollTop;
          title.textContent=readingCacheInfo.title;
          body.innerHTML=readingCacheInfo.html;
          card.scrollTop=scrollTop;
        }
        card.classList.add("show");
      }

      function initCanvasInteractions(){
        const canvas=state.canvas;
        canvas.addEventListener("contextmenu",evt=>evt.preventDefault());
        canvas.addEventListener("wheel",evt=>{
          evt.preventDefault();zoomAt(canvasPoint(evt),evt.deltaY<0?1.1:0.9);
        },{passive:false});
        canvas.addEventListener("pointerdown",evt=>{
          initAudio();canvas.setPointerCapture(evt.pointerId);
          const p=canvasPoint(evt);state.pointers.set(evt.pointerId,p);
          if(state.pointers.size===2){
            const pts=[...state.pointers.values()];state.panning=true;
            state.pinchStart={
              dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),
              mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},
              scale:state.view.scale,offsetX:state.view.offsetX,offsetY:state.view.offsetY
            };
            return;
          }
          if(evt.button===2||state.mode==="pan"){state.panning=true;state.panLastScreen=p;return}
          const world=screenToWorld(p),editable=hitEditableValue(world),labelHit=hitLabel(world),term=hitTerminal(world),comp=hitComponent(world),wire=hitWire(world),nearWire=getNearestWirePoint(world,14);

          if(editable){
            editComponentValue(editable.component);
            return;
          }

          if(labelHit){
            const targetComp=labelHit.component;
            pushHistory();
            ensureLabelOffset(targetComp);
            state.labelDragging={
              componentId:targetComp.id,
              startWorld:world,
              startOffset:{...targetComp.labelOffset},
              startValueOffset:{...targetComp.valueLabelOffset}
            };
            return;
          }
          if(state.pendingAddType){
            if(state.pendingAddType==="wire"){
              state.mode="wire";state.pendingAddType=null;refreshPaletteSelection();render();
              if(term&&!state.pendingWireStart)state.pendingWireStart=term;return;
            }
            if(state.pendingAddType==="junction"&&nearWire){
              const ok=addComponentAt("junction",{x:nearWire.x,y:nearWire.y});
              if(ok){state.pendingAddType=null;refreshPaletteSelection()}return;
            }
            if(term&&state.pendingAddType!=="junction"){
              const ok=addComponentFromExistingTerminal(state.pendingAddType,term);
              if(ok){state.pendingAddType=null;refreshPaletteSelection()}return;
            }
            if(state.pendingAddType!=="junction"&&nearWire){
              const existing=state.components.find(c=>c.isJunction&&c.x===nearWire.x&&c.y===nearWire.y);
              if(existing){
                const ok=addComponentFromExistingTerminal(state.pendingAddType,{componentId:existing.id,side:"node"});
                if(ok){state.pendingAddType=null;refreshPaletteSelection()}return;
              }
            }
            const ok=addComponentAt(state.pendingAddType,world);
            if(ok){state.pendingAddType=null;refreshPaletteSelection()}return;
          }
          if(state.mode==="wire"){
            if(!state.pendingWireStart){
              if(term){state.pendingWireStart=term;render();return}
              if(nearWire){
                pushHistory();const node=splitWireAtPoint(nearWire.wire,nearWire.x,nearWire.y);
                if(node){state.pendingWireStart={componentId:node.id,side:"node"};solveAndRender()}return;
              }
              render();return;
            }
            if(term){
              pushHistory();addWire(state.pendingWireStart,term);state.pendingWireStart=null;solveAndRender();return;
            }
            if(nearWire){
              pushHistory();let node=state.components.find(c=>c.isJunction&&c.x===nearWire.x&&c.y===nearWire.y);
              if(!node)node=splitWireAtPoint(nearWire.wire,nearWire.x,nearWire.y);
              if(node){
                addWire(state.pendingWireStart,{componentId:node.id,side:"node"});
                state.pendingWireStart={componentId:node.id,side:"node"};solveAndRender();
              }
              return;
            }
            pushHistory();const j=ensureJunctionAt(world.x,world.y);
            if(j){
              addWire(state.pendingWireStart,{componentId:j.id,side:"node"});
              state.pendingWireStart={componentId:j.id,side:"node"};solveAndRender();
            }
            return;
          }
          if(comp){
            if(!state.selectedComponents.has(comp.id)){clearSelection();state.selectedComponents.add(comp.id)}
            state.dragging=true;state.dragLastWorld=world;state.dragStartWorld=world;state.dragMoved=false;
            state.pressedComponentId=comp.id;state.pressedWireId=null;state.dragSnapshot=cloneData();resetRenderToLogical();render();return;
          }
          if(wire){
            clearSelection();state.selectedWires.add(wire.id);state.pressedWireId=wire.id;state.pressedComponentId=null;render();return;
          }
          if(!evt.shiftKey)clearSelection();
          state.selectionBox={x1:world.x,y1:world.y,x2:world.x,y2:world.y};render();
        });
        canvas.addEventListener("pointermove",evt=>{
          const p=canvasPoint(evt);state.pointers.set(evt.pointerId,p);
          if(state.pointers.size===2&&state.pinchStart){
            const pts=[...state.pointers.values()],dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
            const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},factor=dist/Math.max(1,state.pinchStart.dist);
            const targetScale=Math.max(state.view.minScale,Math.min(state.view.maxScale,state.pinchStart.scale*factor));
            state.view.scale=targetScale;
            state.view.offsetX=state.pinchStart.offsetX+(mid.x-state.pinchStart.mid.x);
            state.view.offsetY=state.pinchStart.offsetY+(mid.y-state.pinchStart.mid.y);render();return;
          }
          if(state.panning){
            const dx=p.x-state.panLastScreen.x,dy=p.y-state.panLastScreen.y;
            state.view.offsetX+=dx;state.view.offsetY+=dy;state.panLastScreen=p;render();return;
          }
          const world=screenToWorld(p);state.hoverTerminal=hitTerminal(world);
          if(!state.hoverTerminal&&(state.pendingAddType==="junction"||state.mode==="wire")){
            const near=getNearestWirePoint(world,14);
            if(near){
              const existing=state.components.find(c=>c.isJunction&&c.x===near.x&&c.y===near.y);
              if(existing)state.hoverTerminal={componentId:existing.id,side:"node"};
            }
          }
          if(state.labelDragging){
            const c=state.components.find(x=>x.id===state.labelDragging.componentId);
            if(c){
              const dx=world.x-state.labelDragging.startWorld.x;
              const dy=world.y-state.labelDragging.startWorld.y;
              c.labelOffset={
                x:state.labelDragging.startOffset.x+dx,
                y:state.labelDragging.startOffset.y+dy
              };
              c.valueLabelOffset={
                x:state.labelDragging.startValueOffset.x+dx,
                y:state.labelDragging.startValueOffset.y+dy
              };
            }
            render();return;
          }
          if(state.dragging&&state.dragLastWorld){
            const dx=world.x-state.dragLastWorld.x,dy=world.y-state.dragLastWorld.y;
            if(!state.dragMoved&&state.dragStartWorld){
              const total=Math.hypot(world.x-state.dragStartWorld.x,world.y-state.dragStartWorld.y);
              if(total>=CLICK_DRAG_THRESHOLD/state.view.scale)state.dragMoved=true;
            }
            moveSelectedPreviewByWorld(dx,dy);state.dragLastWorld=world;render();return;
          }
          if(state.selectionBox){state.selectionBox.x2=world.x;state.selectionBox.y2=world.y}
          render();
        });
        function releasePointer(evt){
          state.pointers.delete(evt.pointerId);
          if(state.pointers.size<2)state.pinchStart=null;
          if(state.labelDragging){state.labelDragging=null;solveAndRender();return}
          if(state.panning&&(evt.button===2||state.mode==="pan"||evt.pointerType==="touch")){
            if(state.pointers.size<1){state.panning=false;state.panLastScreen=null}return;
          }
          if(state.dragging){
            const pressedId=state.pressedComponentId,moved=state.dragMoved,before=state.dragSnapshot;
            state.dragging=false;state.dragLastWorld=null;state.dragStartWorld=null;state.dragMoved=false;state.pressedComponentId=null;state.dragSnapshot=null;
            let committed=true;
            if(moved)committed=commitSelectedRenderPositions();
            if(!committed)restoreData(before);
            else{
              const after=cloneData();
              if(moved&&JSON.stringify(before.components)!==JSON.stringify(after.components))state.history.push(before);
            }
            solveAndRender();
            if(!moved&&pressedId){
              const c=state.components.find(x=>x.id===pressedId);
              if(c){
                if(c.type==="switch"){toggleSwitchById(pressedId);return}
                if(c.type==="bulb"||c.type==="resistor"){editComponentValue(c);return}
                if(c.type==="ammeter"||c.type==="voltmeter"){
                  state.meterExplainTarget=c.id;updateMeterExplainCard();
                  document.getElementById("meterExplainCard").classList.add("show");return;
                }
              }
            }
            return;
          }
          if(state.selectionBox){selectWithinBox(state.selectionBox);state.selectionBox=null;render()}
        }
        canvas.addEventListener("pointerup",releasePointer);canvas.addEventListener("pointercancel",releasePointer);
      }
      function refreshPaletteSelection(){
        document.querySelectorAll(".part").forEach(node=>{
          const isWire=node.dataset.type==="wire"&&state.mode==="wire"&&!state.pendingAddType;
          node.classList.toggle("active",node.dataset.type===state.pendingAddType||isWire);
        });
      }
      function populateParts(){
        const grid=document.getElementById("partsGrid");grid.innerHTML="";
        const lang=I18N[state.lang];
        PART_DEFS.forEach(def=>{
          const cap=def.type.charAt(0).toUpperCase()+def.type.slice(1),div=document.createElement("div");
          div.className="part";div.dataset.type=def.type;
          div.innerHTML=`<div class="icon">${def.icon}</div><div class="name">${lang["part"+cap]}</div><div class="small">${lang["partNote"+cap]||""}</div>`;
          div.addEventListener("click",()=>{
            if(def.type==="wire"){
              state.pendingAddType=null;state.pendingWireStart=null;state.mode=state.mode==="wire"?"select":"wire";
            }else{
              state.pendingAddType=state.pendingAddType===def.type?null:def.type;state.mode="select";state.pendingWireStart=null;
            }
            refreshPaletteSelection();render();
          });
          grid.appendChild(div);
        });
        refreshPaletteSelection();
      }
      function applyLanguage(){
        document.documentElement.lang=state.lang==="en"?"en":"zh-Hant";
        const bindings={
          brandTitle:"brandTitle",brandSubtitle:"brandSubtitle",
          selectModeBtn:"selectMode",panModeBtn:"panMode",rotateLeftBtn:"rotateLeft",
          rotateRightBtn:"rotateRight",rotateCircuitBtn:"rotateCircuit",undoBtn:"undo",
          deleteBtn:"delete",clearBtn:"clear",saveProjectBtn:"saveProject",loadProjectBtn:"loadProject",
          exportJpegBtn:"exportJpeg",tutorialBtn:"tutorial",languageBtn:"language",
          partsTitle:"partsTitle",guideTitle:"guideTitle",guideIntro:"guideIntro",
          notesTitle:"notesTitle",notesBody:"notesBody",tutorialModalTitle:"tutorialModalTitle",
          tutorialPrevBtn:"tutorialPrev",tutorialNextBtn:"tutorialNext"
        };
        for(const [id,key]of Object.entries(bindings))document.getElementById(id).textContent=t(key);
        const list=document.getElementById("guideList");list.innerHTML="";
        I18N[state.lang].guideList.forEach(item=>{
          const li=document.createElement("li");li.textContent=item;list.appendChild(li);
        });
        populateParts();updateTutorialModal();render();
      }
      function updateTutorialModal(){
        const pages=I18N[state.lang].tutPages;state.tutorialPage=Math.max(0,Math.min(state.tutorialPage,pages.length-1));
        const page=pages[state.tutorialPage];
        document.getElementById("tutorialPageTitle").textContent=page.title;
        document.getElementById("tutorialPageBody").innerHTML=page.body;
        document.getElementById("tutorialPageIndicator").textContent=`${state.tutorialPage+1} / ${pages.length}`;
        document.getElementById("tutorialPrevBtn").disabled=state.tutorialPage===0;
        document.getElementById("tutorialNextBtn").textContent=state.tutorialPage===pages.length-1?t("tutorialDone"):t("tutorialNext");
      }
      function openModal(id){document.getElementById(id).classList.add("show")}
      function closeModal(id){document.getElementById(id).classList.remove("show")}
      function clearAll(){
        pushHistory();state.components=[];state.wires=[];clearSelection();state.pendingAddType=null;
        state.pendingWireStart=null;state.meterExplainTarget=null;stopRemovedBuzzers();refreshPaletteSelection();solveAndRender();
      }
      function serializeProject(){
        return {
          app:"Circuit Learning Studio",version:PROJECT_FILE_VERSION,savedAt:new Date().toISOString(),
          lang:state.lang,view:{...state.view},
          components:JSON.parse(JSON.stringify(state.components)),wires:JSON.parse(JSON.stringify(state.wires))
        };
      }
      function saveProject(){
        const data=serializeProject(),blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
        a.href=url;a.download="circuit-project.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      }
      function loadProjectFromData(data){
        if(!data||!Array.isArray(data.components)||!Array.isArray(data.wires))throw new Error("Invalid project file.");
        pushHistory();state.components=JSON.parse(JSON.stringify(data.components));state.wires=JSON.parse(JSON.stringify(data.wires));
        state.view=data.view?{...state.view,...data.view}:state.view;
        if(data.lang&&I18N[data.lang])state.lang=data.lang;
        clearSelection();state.pendingAddType=null;state.pendingWireStart=null;state.meterExplainTarget=null;
        for(const c of state.components){
          c.renderX=c.x;c.renderY=c.y;c.angle=normalizeComponentAngle(c.type,typeof c.angle==="number"?c.angle:0);
          if(typeof c.current!=="number")c.current=0;
          if(typeof c.voltage!=="number")c.voltage=0;
          if(typeof c.power!=="number")c.power=0;
          if(typeof c.branchVoltage!=="number")c.branchVoltage=0;
          if(typeof c.scale!=="number")c.scale=c.isJunction?1:PLACE_SCALE;
          ensureLabelOffset(c);
        }
        refreshPaletteSelection();applyLanguage();solveAndRender();
      }
      function promptLoadProject(){
        const input=document.getElementById("projectFileInput");input.value="";input.click();
      }
      function exportJPEG(){
        const prevExplain=state.meterExplainTarget,prevHover=state.hoverTerminal,prevSelBox=state.selectionBox,prevPendingWire=state.pendingWireStart;
        const prevSelComps=new Set(state.selectedComponents),prevSelWires=new Set(state.selectedWires);
        state.meterExplainTarget=null;state.hoverTerminal=null;state.selectionBox=null;state.pendingWireStart=null;
        state.selectedComponents.clear();state.selectedWires.clear();render(true);
        const url=state.canvas.toDataURL("image/jpeg",0.95),a=document.createElement("a");
        a.href=url;a.download="circuit-diagram.jpg";document.body.appendChild(a);a.click();a.remove();
        state.meterExplainTarget=prevExplain;state.hoverTerminal=prevHover;state.selectionBox=prevSelBox;state.pendingWireStart=prevPendingWire;
        state.selectedComponents=prevSelComps;state.selectedWires=prevSelWires;render();
      }
      function bindUI(){
        document.getElementById("selectModeBtn").addEventListener("click",()=>setMode("select"));
        document.getElementById("panModeBtn").addEventListener("click",()=>setMode("pan"));
        document.getElementById("rotateLeftBtn").addEventListener("click",()=>rotateSelected(-ROTATE_STEP));
        document.getElementById("rotateRightBtn").addEventListener("click",()=>rotateSelected(ROTATE_STEP));
        document.getElementById("rotateCircuitBtn").addEventListener("click",rotateWholeCircuit);
        document.getElementById("undoBtn").addEventListener("click",undo);
        document.getElementById("deleteBtn").addEventListener("click",deleteSelection);
        document.getElementById("clearBtn").addEventListener("click",clearAll);
        document.getElementById("saveProjectBtn").addEventListener("click",saveProject);
        document.getElementById("loadProjectBtn").addEventListener("click",promptLoadProject);
        document.getElementById("exportJpegBtn").addEventListener("click",exportJPEG);
        document.getElementById("projectFileInput").addEventListener("change",async e=>{
          const file=e.target.files&&e.target.files[0];if(!file)return;
          try{const text=await file.text();loadProjectFromData(JSON.parse(text))}catch(err){console.error(err)}
        });
        document.getElementById("languageBtn").addEventListener("click",()=>{
          state.lang=state.lang==="en"?"zhHant":"en";applyLanguage();
        });
        document.getElementById("tutorialBtn").addEventListener("click",()=>{
          updateTutorialModal();openModal("tutorialModalBackdrop");
        });
        document.getElementById("meterExplainClose").addEventListener("click",()=>{
          state.meterExplainTarget=null;render();
        });
        document.getElementById("tutorialModalClose").addEventListener("click",()=>closeModal("tutorialModalBackdrop"));
        document.getElementById("tutorialModalBackdrop").addEventListener("click",e=>{
          if(e.target.id==="tutorialModalBackdrop")closeModal("tutorialModalBackdrop");
        });
        document.getElementById("tutorialPrevBtn").addEventListener("click",()=>{
          state.tutorialPage--;updateTutorialModal();
        });
        document.getElementById("tutorialNextBtn").addEventListener("click",()=>{
          const pages=I18N[state.lang].tutPages;
          if(state.tutorialPage>=pages.length-1)closeModal("tutorialModalBackdrop");
          else{state.tutorialPage++;updateTutorialModal()}
        });
        window.addEventListener("keydown",e=>{
          const key=e.key.toLowerCase();
          if((e.ctrlKey||e.metaKey)&&key==="z"){e.preventDefault();undo();return}
          if((e.ctrlKey||e.metaKey)&&key==="s"){e.preventDefault();saveProject();return}
          if(key==="delete"||key==="backspace"){
            if(state.selectedComponents.size||state.selectedWires.size){e.preventDefault();deleteSelection()}return;
          }
          if(e.key==="["){e.preventDefault();rotateSelected(-ROTATE_STEP);return}
          if(e.key==="]"){e.preventDefault();rotateSelected(ROTATE_STEP);return}
          if(e.key==="Escape"){
            closeModal("tutorialModalBackdrop");state.pendingWireStart=null;state.pendingAddType=null;
            state.selectionBox=null;state.dragging=false;state.panning=false;state.labelDragging=null;
            state.meterExplainTarget=null;state.mode="select";refreshPaletteSelection();resetRenderToLogical();render();
          }
        });
        window.addEventListener("resize",render);
      }
      function animate(){state.frame++;render();requestAnimationFrame(animate)}
      function init(){
        state.canvas=document.getElementById("canvas");state.ctx=state.canvas.getContext("2d");
        bindUI();initCanvasInteractions();applyLanguage();ensureAllLabelOffsets();solveAndRender();animate();
      }
      init();
    })();
  </script>
