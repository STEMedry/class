        const title=document.getElementById("meterExplainTitle"),body=document.getElementById("meterExplainBody");
        if(!state.meterExplainTarget){card.classList.remove("show");return}
        const c=state.components.find(x=>x.id===state.meterExplainTarget);
        if(!c||!["ammeter","voltmeter"].includes(c.type)){card.classList.remove("show");return}
        const key=JSON.stringify({
          target:c.id,lang:state.lang,
          components:state.components.map(x=>({
            id:x.id,type:x.type,x:x.x,y:x.y,angle:x.angle,scale:x.scale,isJunction:x.isJunction,
            resistance:x.resistance,sourceVoltage:x.sourceVoltage,closed:x.closed,
            current:x.current,voltage:x.voltage,currentValid:x.currentValid,voltageValid:x.voltageValid
          })),
          wires:state.wires.map(w=>({id:w.id,from:w.from,to:w.to,path:w.path})),
          solved:state.lastPhysics?.solved,nodes:state.lastPhysics?.nodeVoltages
        });
        if(key!==readingCacheKey){
          readingCacheKey=key;
          readingCacheInfo=c.type==="ammeter"?getCircuitSummaryForAmmeter(c):getCircuitSummaryForVoltmeter(c);
        }
        if(readingDOMKey!==key){
          readingDOMKey=key;
          const scrollTop=card.scrollTop;
          title.textContent=readingCacheInfo.title;body.innerHTML=readingCacheInfo.html;
          card.scrollTop=scrollTop;
        }
        card.classList.add("show");
      }
      function getLabelKindOffset(c,kind){return kind==="name"?c.labelOffset:c.valueLabelOffset}
      function setLabelKindOffset(c,kind,offset){
        if(kind==="name")c.labelOffset=offset;else c.valueLabelOffset=offset;
      }
      function consumeClickCandidate(){
        const cand=state.clickCandidate;if(!cand)return;
        state.clickCandidate=null;
        if(cand.type==="component"){
          const c=state.components.find(x=>x.id===cand.id);if(!c)return;
          if(c.type==="switch"){toggleSwitchById(c.id);return}
          if(c.type==="ammeter"||c.type==="voltmeter"){
            state.meterExplainTarget=c.id;updateMeterExplainCard();
            document.getElementById("meterExplainCard").classList.add("show");return;
          }
          clearSelection();state.selectedComponents.add(c.id);render();return;
        }
        if(cand.type==="wire"){
          clearSelection();state.selectedWires.add(cand.id);render();return;
        }
        if(cand.type==="empty"){clearSelection();render()}
      }
      function registerSingleClickCandidate(candidate){
        state.clickCandidate=candidate;
        setTimeout(()=>{
          if(state.clickCandidate===candidate)consumeClickCandidate();
        },DOUBLE_CLICK_MS+20);
      }
      function initCanvasInteractions(){
        const canvas=state.canvas;
        canvas.addEventListener("contextmenu",evt=>evt.preventDefault());
        canvas.addEventListener("wheel",evt=>{
          evt.preventDefault();zoomAt(canvasPoint(evt),evt.deltaY<0?1.1:0.9);
        },{passive:false});
        canvas.addEventListener("dblclick",evt=>{
          const world=screenToWorld(canvasPoint(evt)),editable=hitEditableValue(world);
          if(editable){state.clickCandidate=null;editComponentValue(editable.component)}
        });
        canvas.addEventListener("pointerdown",evt=>{
          initAudio();canvas.setPointerCapture(evt.pointerId);
          const p=canvasPoint(evt);state.pointers.set(evt.pointerId,p);
          if(state.pointers.size===2){
            const pts=[...state.pointers.values()];
            state.panning=true;state.panLastScreen=p;
            state.pinchStart={
              dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),
              mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},
              scale:state.view.scale,offsetX:state.view.offsetX,offsetY:state.view.offsetY
            };
            return;
          }
          if(evt.button===2||state.mode==="pan"){
            state.panning=true;state.panLastScreen=p;return;
          }
          const world=screenToWorld(p),labelHit=hitLabel(world),term=hitTerminal(world);
          const comp=hitComponent(world),wire=hitWire(world),nearWire=getNearestWirePoint(world,14);
          if(labelHit){
            state.clickCandidate=null;pushHistory();ensureLabelOffset(labelHit.component);
            const currentOff=getLabelKindOffset(labelHit.component,labelHit.kind);
            state.labelDragging={
              componentId:labelHit.component.id,kind:labelHit.kind,startWorld:world,startOffset:{...currentOff}
            };
            return;
          }
          if(state.pendingAddType){
            if(state.pendingAddType==="wire"){
              state.mode="wire";state.pendingAddType=null;refreshPaletteSelection();render();
              if(term&&!state.pendingWireStart)state.pendingWireStart=term;
              return;
            }
            if(state.pendingAddType==="junction"&&nearWire){
              const ok=addComponentAt("junction",{x:nearWire.x,y:nearWire.y});
              if(ok){state.pendingAddType=null;refreshPaletteSelection()}
              return;
            }
            if(term&&state.pendingAddType!=="junction"){
              const ok=addComponentFromExistingTerminal(state.pendingAddType,term);
              if(ok){state.pendingAddType=null;refreshPaletteSelection()}
              return;
            }
            if(state.pendingAddType!=="junction"&&nearWire){
              const existing=state.components.find(c=>c.isJunction&&c.x===nearWire.x&&c.y===nearWire.y);
              if(existing){
                const ok=addComponentFromExistingTerminal(state.pendingAddType,{componentId:existing.id,side:"node"});
                if(ok){state.pendingAddType=null;refreshPaletteSelection()}
                return;
              }
            }
            const ok=addComponentAt(state.pendingAddType,world);
            if(ok){state.pendingAddType=null;refreshPaletteSelection()}
            return;
          }
          if(state.mode==="wire"){
            if(!state.pendingWireStart){
              if(term){state.pendingWireStart=term;render();return}
              if(nearWire){
                pushHistory();
                const node=splitWireAtPoint(nearWire.wire,nearWire.x,nearWire.y);
                if(node){state.pendingWireStart={componentId:node.id,side:"node"};solveAndRender()}
                return;
              }
              render();return;
            }
            if(term){
              pushHistory();addWire(state.pendingWireStart,term);
              state.pendingWireStart=null;solveAndRender();return;
            }
            if(nearWire){
              pushHistory();
              let node=state.components.find(c=>c.isJunction&&c.x===nearWire.x&&c.y===nearWire.y);
              if(!node)node=splitWireAtPoint(nearWire.wire,nearWire.x,nearWire.y);
              if(node){
                addWire(state.pendingWireStart,{componentId:node.id,side:"node"});
                state.pendingWireStart={componentId:node.id,side:"node"};solveAndRender();
              }
              return;
            }
            pushHistory();
            const j=ensureJunctionAt(world.x,world.y);
            if(j){
              addWire(state.pendingWireStart,{componentId:j.id,side:"node"});
              state.pendingWireStart={componentId:j.id,side:"node"};solveAndRender();
            }
            return;
          }
          if(comp){
            if(!state.selectedComponents.has(comp.id)){clearSelection();state.selectedComponents.add(comp.id)}
            state.dragging=true;state.dragLastWorld=world;state.dragStartWorld=world;state.dragMoved=false;
            state.pressedComponentId=comp.id;state.pressedWireId=null;
            state.dragSnapshot=cloneData();resetRenderToLogical();render();return;
          }
          if(wire){
            clearSelection();state.selectedWires.add(wire.id);
            state.pressedWireId=wire.id;state.pressedComponentId=null;
            state.lastPointerDown={type:"wire",id:wire.id,world};render();return;
          }
          if(!evt.shiftKey)clearSelection();
          state.selectionBox={x1:world.x,y1:world.y,x2:world.x,y2:world.y};render();
        });
        canvas.addEventListener("pointermove",evt=>{
          const p=canvasPoint(evt);
          if(state.pointers.has(evt.pointerId))state.pointers.set(evt.pointerId,p);
          if(state.pointers.size===2&&state.pinchStart){
            const pts=[...state.pointers.values()];
            const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
            const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
            const factor=dist/Math.max(1,state.pinchStart.dist);
            const targetScale=Math.max(state.view.minScale,Math.min(state.view.maxScale,state.pinchStart.scale*factor));
            state.view.scale=targetScale;
            state.view.offsetX=state.pinchStart.offsetX+(mid.x-state.pinchStart.mid.x);
            state.view.offsetY=state.pinchStart.offsetY+(mid.y-state.pinchStart.mid.y);
            render();return;
          }
          if(state.panning){
            if(!state.panLastScreen){state.panLastScreen=p;return}
            const dx=p.x-state.panLastScreen.x,dy=p.y-state.panLastScreen.y;
            state.view.offsetX+=dx;state.view.offsetY+=dy;state.panLastScreen=p;render();return;
          }
          const world=screenToWorld(p);state.hoverTerminal=hitTerminal(world);
          if(!state.hoverTerminal&&(state.pendingAddType==="junction"||state.mode==="wire")){
            const near=getNearestWirePoint(world,14);
            if(near){
              const existing=state.components.find(c=>c.isJunction&&c.x===near.x&&c.y===near.y);
              if(existing)state.hoverTerminal={componentId:existing.id,side:"node"};
            }
          }
          if(state.labelDragging){
            const c=state.components.find(x=>x.id===state.labelDragging.componentId);
            if(c){
              const dx=world.x-state.labelDragging.startWorld.x,dy=world.y-state.labelDragging.startWorld.y;
              setLabelKindOffset(c,state.labelDragging.kind,{
                x:state.labelDragging.startOffset.x+dx,y:state.labelDragging.startOffset.y+dy
              });
            }
            render();return;
          }
          if(state.dragging&&state.dragLastWorld){
            const dx=world.x-state.dragLastWorld.x,dy=world.y-state.dragLastWorld.y;
            if(!state.dragMoved&&state.dragStartWorld){
              const total=Math.hypot(world.x-state.dragStartWorld.x,world.y-state.dragStartWorld.y);
              if(total>=CLICK_DRAG_THRESHOLD/state.view.scale)state.dragMoved=true;
            }
            moveSelectedPreviewByWorld(dx,dy);state.dragLastWorld=world;render();return;
          }
          if(state.selectionBox){state.selectionBox.x2=world.x;state.selectionBox.y2=world.y}
          render();
        });
        function releasePointer(evt){
          state.pointers.delete(evt.pointerId);
          if(state.pointers.size<2)state.pinchStart=null;
          if(state.labelDragging){state.labelDragging=null;solveAndRender();return}
          if(state.panning&&(evt.button===2||state.mode==="pan"||evt.pointerType==="touch")){
            if(state.pointers.size<1){state.panning=false;state.panLastScreen=null}
            else state.panLastScreen=[...state.pointers.values()][0];
            return;
          }
          if(state.dragging){
            const pressedId=state.pressedComponentId,moved=state.dragMoved,before=state.dragSnapshot;
            state.dragging=false;state.dragLastWorld=null;state.dragStartWorld=null;
            state.dragMoved=false;state.pressedComponentId=null;state.dragSnapshot=null;
            let committed=true;
            if(moved)committed=commitSelectedRenderPositions();
            else resetRenderToLogical();
            if(!committed)restoreData(before);
            else{
              const after=cloneData();
              if(moved&&JSON.stringify(before.components)!==JSON.stringify(after.components))
                state.history.push(before);
            }
            solveAndRender();
            if(!moved&&pressedId)registerSingleClickCandidate({type:"component",id:pressedId});
            return;
          }
          if(state.selectionBox){
            const box=state.selectionBox,dx=Math.abs(box.x2-box.x1),dy=Math.abs(box.y2-box.y1);
            state.selectionBox=null;
            if(dx<4/state.view.scale&&dy<4/state.view.scale)registerSingleClickCandidate({type:"empty"});
            else{selectWithinBox(box);render()}
            return;
          }
          if(state.pressedWireId){
            registerSingleClickCandidate({type:"wire",id:state.pressedWireId});state.pressedWireId=null;
          }
        }
        canvas.addEventListener("pointerup",releasePointer);
        canvas.addEventListener("pointercancel",releasePointer);
      }

      function refreshPaletteSelection(){
        document.querySelectorAll(".part").forEach(node=>{
          const isWire=node.dataset.type==="wire"&&state.mode==="wire"&&!state.pendingAddType;
          node.classList.toggle("active",node.dataset.type===state.pendingAddType||isWire);
        });
      }
      function populateParts(){
        const grid=document.getElementById("partsGrid");grid.innerHTML="";
        const lang=I18N[state.lang];
        PART_DEFS.forEach(def=>{
          const cap=def.type.charAt(0).toUpperCase()+def.type.slice(1),div=document.createElement("div");
          div.className="part";div.dataset.type=def.type;
          div.innerHTML=`<div class="icon">${def.icon}</div><div class="name">${lang["part"+cap]}</div><div class="small">${lang["partNote"+cap]||""}</div>`;
          div.addEventListener("click",()=>{
            if(def.type==="wire"){
              state.pendingAddType=null;state.pendingWireStart=null;
              state.mode=state.mode==="wire"?"select":"wire";
            }else{
              state.pendingAddType=state.pendingAddType===def.type?null:def.type;
              state.mode="select";state.pendingWireStart=null;
            }
            refreshPaletteSelection();render();
          });
          grid.appendChild(div);
        });
        refreshPaletteSelection();
      }
      function applyLanguage(){
        document.documentElement.lang=state.lang==="en"?"en":"zh-Hant";
        const bindings={
          brandTitle:"brandTitle",brandSubtitle:"brandSubtitle",selectModeBtn:"selectMode",panModeBtn:"panMode",
          rotateLeftBtn:"rotateLeft",rotateRightBtn:"rotateRight",rotateCircuitBtn:"rotateCircuit",undoBtn:"undo",
          deleteBtn:"delete",clearBtn:"clear",saveProjectBtn:"saveProject",loadProjectBtn:"loadProject",
          exportJpegBtn:"exportJpeg",tutorialBtn:"tutorial",languageBtn:"language",partsTitle:"partsTitle",
          guideTitle:"guideTitle",guideIntro:"guideIntro",notesTitle:"notesTitle",notesBody:"notesBody",
          tutorialModalTitle:"tutorialModalTitle",tutorialPrevBtn:"tutorialPrev",tutorialNextBtn:"tutorialNext"
        };
        for(const [id,key] of Object.entries(bindings))document.getElementById(id).textContent=t(key);
        const list=document.getElementById("guideList");list.innerHTML="";
        I18N[state.lang].guideList.forEach(item=>{
          const li=document.createElement("li");li.textContent=item;list.appendChild(li);
        });
        populateParts();updateTutorialModal();render();
      }
      function updateTutorialModal(){
        const pages=I18N[state.lang].tutPages;
        state.tutorialPage=Math.max(0,Math.min(state.tutorialPage,pages.length-1));
        const page=pages[state.tutorialPage];
        document.getElementById("tutorialPageTitle").textContent=page.title;
        document.getElementById("tutorialPageBody").innerHTML=page.body;
        document.getElementById("tutorialPageIndicator").textContent=`${state.tutorialPage+1} / ${pages.length}`;
        document.getElementById("tutorialPrevBtn").disabled=state.tutorialPage===0;
        document.getElementById("tutorialNextBtn").textContent=
          state.tutorialPage===pages.length-1?t("tutorialDone"):t("tutorialNext");
      }
      function openModal(id){document.getElementById(id).classList.add("show")}
      function closeModal(id){document.getElementById(id).classList.remove("show")}
      function clearAll(){
        pushHistory();state.components=[];state.wires=[];clearSelection();
        state.pendingAddType=null;state.pendingWireStart=null;state.meterExplainTarget=null;
        stopRemovedBuzzers();refreshPaletteSelection();solveAndRender();
      }
      function serializeProject(){
        return {
          app:"Circuit Learning Studio",version:PROJECT_FILE_VERSION,savedAt:new Date().toISOString(),
          lang:state.lang,view:{...state.view},
          components:JSON.parse(JSON.stringify(state.components)),
          wires:JSON.parse(JSON.stringify(state.wires))
        };
      }
      function saveProject(){
        const data=serializeProject();
        const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob),a=document.createElement("a");
        a.href=url;a.download="circuit-project.json";
        document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      }
      function loadProjectFromData(data){
        if(!data||!Array.isArray(data.components)||!Array.isArray(data.wires))
          throw new Error("Invalid project file.");
        pushHistory();
        state.components=JSON.parse(JSON.stringify(data.components));
        state.wires=JSON.parse(JSON.stringify(data.wires));
        state.view=data.view?{...state.view,...data.view}:state.view;
        if(data.lang&&I18N[data.lang])state.lang=data.lang;
        clearSelection();state.pendingAddType=null;state.pendingWireStart=null;state.meterExplainTarget=null;
        for(const c of state.components){
          c.renderX=c.x;c.renderY=c.y;
          c.angle=normalizeComponentAngle(c.type,typeof c.angle==="number"?c.angle:0);
          if(typeof c.current!=="number")c.current=0;
          if(typeof c.voltage!=="number")c.voltage=0;
          if(typeof c.power!=="number")c.power=0;
          if(typeof c.branchVoltage!=="number")c.branchVoltage=0;
          if(typeof c.scale!=="number")c.scale=c.isJunction?1:PLACE_SCALE;
          ensureLabelOffset(c);
        }
        refreshPaletteSelection();applyLanguage();solveAndRender();
      }
      function promptLoadProject(){
        const input=document.getElementById("projectFileInput");input.value="";input.click();
      }
      function exportJPEG(){
        const prevExplain=state.meterExplainTarget,prevHover=state.hoverTerminal;
        const prevSelBox=state.selectionBox,prevPendingWire=state.pendingWireStart;
        const prevSelComps=new Set(state.selectedComponents),prevSelWires=new Set(state.selectedWires);
        state.meterExplainTarget=null;state.hoverTerminal=null;
        state.selectionBox=null;state.pendingWireStart=null;
        state.selectedComponents.clear();state.selectedWires.clear();render(true);
        const url=state.canvas.toDataURL("image/jpeg",0.95),a=document.createElement("a");
        a.href=url;a.download="circuit-diagram.jpg";document.body.appendChild(a);a.click();a.remove();
        state.meterExplainTarget=prevExplain;state.hoverTerminal=prevHover;
        state.selectionBox=prevSelBox;state.pendingWireStart=prevPendingWire;
        state.selectedComponents=prevSelComps;state.selectedWires=prevSelWires;render();
      }
      function bindUI(){
        document.getElementById("selectModeBtn").addEventListener("click",()=>setMode("select"));
        document.getElementById("panModeBtn").addEventListener("click",()=>setMode("pan"));
        document.getElementById("rotateLeftBtn").addEventListener("click",()=>rotateSelected(-ROTATE_STEP));
        document.getElementById("rotateRightBtn").addEventListener("click",()=>rotateSelected(ROTATE_STEP));
        document.getElementById("rotateCircuitBtn").addEventListener("click",rotateWholeCircuit);
        document.getElementById("undoBtn").addEventListener("click",undo);
        document.getElementById("deleteBtn").addEventListener("click",deleteSelection);
        document.getElementById("clearBtn").addEventListener("click",clearAll);
        document.getElementById("saveProjectBtn").addEventListener("click",saveProject);
        document.getElementById("loadProjectBtn").addEventListener("click",promptLoadProject);
        document.getElementById("exportJpegBtn").addEventListener("click",exportJPEG);
        document.getElementById("projectFileInput").addEventListener("change",async e=>{
          const file=e.target.files&&e.target.files[0];if(!file)return;
          try{loadProjectFromData(JSON.parse(await file.text()))}catch(err){console.error(err)}
        });
        document.getElementById("languageBtn").addEventListener("click",()=>{
          state.lang=state.lang==="en"?"zhHant":"en";applyLanguage();
        });
        document.getElementById("tutorialBtn").addEventListener("click",()=>{
          updateTutorialModal();openModal("tutorialModalBackdrop");
        });
        document.getElementById("meterExplainClose").addEventListener("click",()=>{
          state.meterExplainTarget=null;render();
        });
        document.getElementById("tutorialModalClose").addEventListener("click",()=>closeModal("tutorialModalBackdrop"));
        document.getElementById("tutorialModalBackdrop").addEventListener("click",e=>{
          if(e.target.id==="tutorialModalBackdrop")closeModal("tutorialModalBackdrop");
        });
        document.getElementById("tutorialPrevBtn").addEventListener("click",()=>{
          state.tutorialPage--;updateTutorialModal();
        });
        document.getElementById("tutorialNextBtn").addEventListener("click",()=>{
          const pages=I18N[state.lang].tutPages;
          if(state.tutorialPage>=pages.length-1)closeModal("tutorialModalBackdrop");
          else{state.tutorialPage++;updateTutorialModal()}
        });
        window.addEventListener("keydown",e=>{
          const key=e.key.toLowerCase();
          if((e.ctrlKey||e.metaKey)&&key==="z"){e.preventDefault();undo();return}
          if((e.ctrlKey||e.metaKey)&&key==="s"){e.preventDefault();saveProject();return}
          if(key==="delete"||key==="backspace"){
            if(state.selectedComponents.size||state.selectedWires.size){e.preventDefault();deleteSelection()}
            return;
          }
          if(e.key==="["){e.preventDefault();rotateSelected(-ROTATE_STEP);return}
          if(e.key==="]"){e.preventDefault();rotateSelected(ROTATE_STEP);return}
          if(e.key==="Escape"){
            closeModal("tutorialModalBackdrop");state.pendingWireStart=null;
            state.pendingAddType=null;state.selectionBox=null;state.dragging=false;
            state.panning=false;state.labelDragging=null;state.meterExplainTarget=null;state.mode="select";
            state.clickCandidate=null;refreshPaletteSelection();resetRenderToLogical();render();
          }
        });
        window.addEventListener("resize",()=>render());
      }
      function animate(){state.frame++;render();requestAnimationFrame(animate)}
      function init(){
        state.canvas=document.getElementById("canvas");
        state.ctx=state.canvas.getContext("2d");
        bindUI();initCanvasInteractions();applyLanguage();
        ensureAllLabelOffsets();solveAndRender();animate();
      }
      init();
    })();
  </script>
</body>
</html>
