<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Circuit Learning Studio — Computational Thinking Edition</title>
  <style>
    :root{
      --bg:#f5f7fb;--panel:#ffffff;--line:#d7deea;--text:#1f2937;
      --muted:#64748b;--blue:#3b82f6;--blue2:#2563eb;--green:#16a34a;
      --red:#dc2626;--orange:#f59e0b;--purple:#7c3aed;
      --shadow:0 10px 30px rgba(15,23,42,.12);--radius:16px;
      --toolbar-h:68px;--left-w:310px;--canvas-bg:#eef2f7;
      --btn-font:12px;--btn-pad-y:8px;--btn-pad-x:10px;--place-scale:0.5;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      touch-action:none;
    }
    .app{display:grid;grid-template-rows:var(--toolbar-h) 1fr;height:100vh;height:100dvh;width:100vw}
    .toolbar{
      display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;
      border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);
      z-index:10;min-width:0;overflow:hidden;flex-wrap:nowrap;
    }
    .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:nowrap;overflow:hidden}
    .brand{display:flex;align-items:center;gap:8px;margin-right:6px;padding-right:8px;border-right:1px solid var(--line);flex:0 0 auto;min-width:0}
    .brand-badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#eff6ff);color:var(--blue2);font-size:18px;flex:0 0 auto}
    .brand-title{font-weight:800;font-size:14px;line-height:1.05;white-space:nowrap}
    .brand-subtitle{font-size:11px;color:var(--muted);line-height:1.05;margin-top:2px;white-space:nowrap}
    .btn,.select{
      border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;
      padding:var(--btn-pad-y) var(--btn-pad-x);font-size:var(--btn-font);font-weight:700;
      cursor:pointer;transition:.16s ease;white-space:nowrap;touch-action:manipulation;line-height:1;flex:0 0 auto;
    }
    .btn:hover,.select:hover{transform:translateY(-1px);border-color:#b7c5dd;background:#fcfdff}
    .btn.primary{background:linear-gradient(180deg,#4f8fff 0%,#3b82f6 100%);color:#fff;border-color:#3b82f6}
    .btn.ghost{background:#f8fbff}
    .btn.toggle-active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);color:var(--blue2);background:#f4f8ff}
    .workspace{display:grid;grid-template-columns:var(--left-w) 1fr;min-width:0;min-height:0}
    .sidebar{border-right:1px solid var(--line);background:linear-gradient(180deg,#fff 0%,#f7faff 100%);padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
    .panel h3{margin:0 0 10px;font-size:14px}
    .panel p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
    .parts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .part{border:1px dashed #c8d5e8;background:#fbfdff;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:.16s ease;user-select:none;touch-action:manipulation}
    .part:hover{border-color:#91b5ff;background:#f4f8ff;transform:translateY(-1px)}
    .part.active{border-style:solid;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);background:#f4f8ff}
    .part .icon{font-size:22px;line-height:1;margin-bottom:6px}
    .part .name{font-size:12px;font-weight:700}
    .part .small{font-size:11px;color:var(--muted);margin-top:4px}
    .hint-list{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.5}
    .main{position:relative;min-width:0;min-height:0;background:#eef2f7;overflow:hidden}
    .canvas-wrap{position:absolute;inset:0;overflow:hidden;touch-action:none}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default;background:var(--canvas-bg)}
    .statusbar{position:absolute;left:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;z-index:2;pointer-events:none}
    .status-pill{background:rgba(255,255,255,.94);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow)}
    .status-pill.complete{color:#166534;border-color:#86efac;background:rgba(240,253,244,.96);font-weight:800}
    .status-pill.open{color:#1d4ed8;border-color:#93c5fd;background:rgba(239,246,255,.96);font-weight:800}
    .status-pill.short{color:#991b1b;border-color:#fca5a5;background:rgba(254,242,242,.97);font-weight:800}
    .overlay-card{
      position:absolute;top:16px;right:16px;z-index:5;width:min(900px,calc(100vw - 32px));
      max-height:min(85vh,900px);overflow:auto;-webkit-overflow-scrolling:touch;
      background:rgba(255,255,255,.99);border:1px solid #d9e2f1;border-radius:20px;
      box-shadow:0 24px 64px rgba(15,23,42,.18);padding:18px 20px 20px;display:none;
    }
    .overlay-card.show{display:block}
    .overlay-card h4{margin:0 0 10px;font-size:18px}
    .overlay-card p,.overlay-card li{font-size:13px;line-height:1.65;color:#475569}
    .overlay-card ul,.overlay-card ol{padding-left:18px;margin:8px 0 0}
    .overlay-close{float:right;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:13px;margin-left:10px}
    .formula{background:#f8fbff;border:1px solid #dbe6f5;border-radius:12px;padding:10px 12px;margin:10px 0;color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;white-space:pre-wrap}
    .explain-hero{border:1px solid #dbe6f5;background:linear-gradient(180deg,#f8fbff 0%,#eef5ff 100%);border-radius:16px;padding:14px;margin-bottom:14px}
    .explain-hero h5{margin:0 0 8px;font-size:15px;color:#1e3a8a}
    .explain-hero p{margin:0;color:#475569}
    .explain-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
    .summary-box{border:1px solid #dbe6f5;background:#fff;border-radius:14px;padding:10px 12px}
    .summary-box .k{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#64748b;margin-bottom:6px}
    .summary-box .v{font-size:18px;font-weight:800;color:#0f172a}
    .summary-box .s{margin-top:4px;font-size:12px;color:#64748b}
    .explain-step{border:1px solid #e3ebf7;border-radius:16px;background:#fff;padding:14px;margin-top:12px}
    .explain-step-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
    .step-badge{display:inline-grid;place-items:center;min-width:88px;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:900;color:#fff;letter-spacing:.02em}
    .step-blue{background:#2563eb}.step-green{background:#16a34a}.step-orange{background:#ea580c}
    .step-purple{background:#7c3aed}.step-red{background:#dc2626}.step-indigo{background:#4f46e5}
    .explain-step h5{margin:0;font-size:15px;color:#1f2937}
    .explain-note{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-top:8px;color:#475569;font-size:13px;line-height:1.6}
    .detail-table{width:100%;border-collapse:collapse;margin-top:10px;overflow:hidden;border-radius:12px;font-size:13px}
    .detail-table th,.detail-table td{border:1px solid #dbe6f5;padding:10px;text-align:left;vertical-align:top}
    .detail-table th{background:#eff6ff;color:#1e3a8a;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
    .modal-backdrop.show{display:flex}
    .modal{width:min(1120px,100%);max-height:min(92vh,920px);overflow:auto;background:#fff;border-radius:20px;border:1px solid #d9e2f1;box-shadow:0 24px 64px rgba(15,23,42,.24);display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
    .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);position:sticky;top:0;z-index:1}
    .modal-title{font-size:18px;font-weight:800;margin:0}
    .modal-close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}
    .modal-body{padding:18px}
    .section{background:#fbfdff;border:1px solid #e1e9f6;border-radius:14px;padding:14px;margin-bottom:12px}
    .section h5{margin:0 0 8px;font-size:14px}
    .section p,.section li{color:#475569;font-size:14px;line-height:1.6}
    .section ul,.section ol{margin:8px 0 0;padding-left:18px}
    .tutorial-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:stretch}
    .tutorial-diagram{border:1px solid #dbe6f5;border-radius:16px;background:linear-gradient(180deg,#f8fbff 0%,#eef5ff 100%);padding:14px;min-height:220px;display:flex;align-items:center;justify-content:center}
    .tutorial-diagram svg{width:100%;max-width:460px;height:auto}
    .tutorial-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .mini-card{border:1px solid #dbe6f5;border-radius:14px;padding:12px;background:#fff}
    .mini-card h6{margin:0 0 6px;font-size:13px}
    .mini-card p{margin:0;font-size:13px;color:#64748b;line-height:1.5}
    .tutorial-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
    .tutorial-page-indicator{font-size:13px;color:var(--muted)}
    .tutorial-buttons{display:flex;gap:8px}
    .credit-badge{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:10px;background:rgba(15,23,42,.62);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;box-shadow:0 18px 40px rgba(15,23,42,.22);backdrop-filter:blur(6px);text-decoration:none}
    .credit-badge:hover{background:rgba(15,23,42,.72)}
    .credit-badge img{height:42px;width:auto;object-fit:contain;display:block;flex:0 0 auto}
    .credit-text{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.1}
    .credit-main{font-family:"Arial Black",Arial,Helvetica,sans-serif;font-weight:900;color:#fff;font-size:16px;white-space:nowrap}
    .credit-sub{color:rgba(255,255,255,.92);font-size:11px;margin-top:4px;white-space:nowrap}
    .tutorial-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
    .tutorial-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
    .pillar-card{border:1px solid #dbe6f5;border-radius:16px;padding:14px;background:#fff;min-height:180px}
    .pillar-card h6{margin:0 0 8px;font-size:14px}
    .pillar-card .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:5px 9px;margin-bottom:8px;color:#fff}
    .tag.blue{background:#2563eb}.tag.green{background:#16a34a}.tag.orange{background:#ea580c}.tag.purple{background:#7c3aed}
    .ct-flow{border:1px solid #dbe6f5;border-radius:16px;background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);padding:14px;margin-top:10px}
    .ct-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
    .ct-step{border:1px solid #dbe6f5;border-radius:14px;background:#fff;padding:10px;min-height:120px}
    .ct-step-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800;margin-bottom:8px}
    .ct-step h6{margin:0 0 6px;font-size:13px}
    .ct-step p{margin:0;font-size:12px;line-height:1.5;color:#64748b}
    .compare-table{width:100%;border-collapse:collapse;margin-top:10px;overflow:hidden;border-radius:12px;font-size:13px}
    .compare-table th,.compare-table td{border:1px solid #dbe6f5;padding:10px;text-align:left;vertical-align:top}
    .compare-table th{background:#eff6ff;color:#1e3a8a;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    .strategy-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
    .strategy-box{border-radius:14px;padding:12px;border:1px solid #dbe6f5;background:#fff}
    .strategy-box strong{display:block;margin-bottom:6px;font-size:13px}
    .strategy-box p{margin:0;font-size:12px;color:#64748b;line-height:1.5}
    #meterExplainCard{touch-action:pan-y}
    #meterExplainBody .reading-step{padding:22px 0;border-bottom:1px solid #d7deea}
    #meterExplainBody .reading-step:last-child{border-bottom:0}
    #meterExplainBody .reading-step h5{margin:0 0 14px;font-size:19px;font-weight:750;line-height:1.45;color:#18202c}
    #meterExplainBody .reading-step p,#meterExplainBody .reading-step li{font-size:15px;line-height:1.8;color:#414852}
    #meterExplainBody .reading-step p{margin:10px 0}
    #meterExplainBody .reading-step li{margin:10px 0}
    #meterExplainBody .math-line{
      padding:15px 8px;margin:12px 0;text-align:center;
      font-family:Cambria,"Times New Roman",serif;font-size:21px;line-height:2;color:#18202c;
      overflow-x:auto;touch-action:pan-x;overflow-wrap:anywhere;
    }
    #meterExplainBody .math-line sub{font-size:.68em}
    #meterExplainBody .math-line strong{font-weight:800}
    #meterExplainBody .math-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.4;margin:0 .22em}
    #meterExplainBody .math-frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em .1em}
    #meterExplainBody .math-frac>span:last-child{padding:.1em .25em 0}
    #meterExplainBody .reading-subsection{margin:14px 0;padding:12px 14px;background:#fafcff;border:1px solid #e2e8f0;border-radius:12px}
    #meterExplainBody .reading-subsection h6{margin:0 0 8px;font-size:15px}
    #meterExplainBody .reading-warning{border:1px solid #fcd34d;background:#fffbeb;border-radius:12px;padding:12px 14px;margin:12px 0;color:#854d0e;font-size:13px;line-height:1.7}
    #meterExplainBody .table-scroll{overflow-x:auto;touch-action:pan-x}
    #meterExplainBody .detail-table td{font-variant-numeric:tabular-nums}
    #meterExplainBody .selected-meter-row{background:#eff6ff;font-weight:700}
    @media (max-width:1220px){
      :root{--btn-font:11px;--btn-pad-y:7px;--btn-pad-x:8px}
      .brand-title{font-size:13px}.brand-subtitle{font-size:10px}
    }
    @media (max-width:1060px){
      .workspace{grid-template-columns:1fr}.sidebar{display:none}
      .tutorial-grid-4,.ct-steps,.strategy-strip,.explain-summary-grid{grid-template-columns:1fr 1fr}
    }
    @media (max-width:760px){
      .toolbar{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
      .tutorial-hero,.tutorial-grid-2,.tutorial-grid-4,.ct-steps,.strategy-strip,.explain-summary-grid{grid-template-columns:1fr}
      .tutorial-cards{grid-template-columns:1fr}
      .credit-badge{right:10px;bottom:10px;padding:8px 10px}
      .credit-badge img{height:36px}.credit-main{font-size:13px}.credit-sub{font-size:10px}
      #meterExplainBody .reading-step h5{font-size:17px}
      #meterExplainBody .math-line{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="brand">
          <div class="brand-badge">⚡</div>
          <div>
            <div class="brand-title" id="brandTitle">Circuit Learning Studio</div>
            <div class="brand-subtitle" id="brandSubtitle">Computational Thinking Edition</div>
          </div>
        </div>
        <button class="btn" id="selectModeBtn"></button>
        <button class="btn" id="panModeBtn"></button>
        <button class="btn" id="rotateLeftBtn"></button>
        <button class="btn" id="rotateRightBtn"></button>
        <button class="btn" id="rotateCircuitBtn"></button>
        <button class="btn" id="undoBtn"></button>
        <button class="btn" id="deleteBtn"></button>
        <button class="btn" id="clearBtn"></button>
        <button class="btn" id="saveProjectBtn"></button>
        <button class="btn" id="loadProjectBtn"></button>
        <button class="btn" id="exportJpegBtn"></button>
      </div>
      <div class="toolbar-right">
        <button class="btn ghost" id="tutorialBtn"></button>
        <button class="btn ghost" id="languageBtn"></button>
      </div>
    </div>
    <div class="workspace">
      <aside class="sidebar">
        <div class="panel"><h3 id="partsTitle"></h3><div class="parts" id="partsGrid"></div></div>
        <div class="panel">
          <h3 id="guideTitle"></h3><p id="guideIntro"></p><ul class="hint-list" id="guideList"></ul>
        </div>
        <div class="panel"><h3 id="notesTitle"></h3><p id="notesBody"></p></div>
      </aside>
      <main class="main">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas"></canvas>
          <div class="overlay-card" id="meterExplainCard">
            <button class="overlay-close" id="meterExplainClose">✕</button>
            <h4 id="meterExplainTitle"></h4>
            <div id="meterExplainBody"></div>
          </div>
          <div class="statusbar">
            <div class="status-pill" id="modeStatus"></div>
            <div class="status-pill" id="circuitStatus"></div>
            <div class="status-pill" id="zoomStatus"></div>
          </div>
          <a class="credit-badge"
             href="https://repository.eduhk.hk/en/persons/chung-yiu-richard%E6%A5%8A%E4%BB%B2%E5%A0%AF-yeung/"
             target="_blank" rel="noopener noreferrer">
            <img src="EdUHK.png" alt="EdUHK" />
            <div class="credit-text">
              <div class="credit-main">Richard C. Y. YEUNG, EdUHK</div>
              <div class="credit-sub">Academy for Education Development and Innovation</div>
            </div>
          </a>
        </div>
      </main>
    </div>
  </div>
  <input type="file" id="projectFileInput" accept=".json,application/json" style="display:none" />
  <div class="modal-backdrop" id="tutorialModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tutorialModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="tutorialModalTitle"></h2>
        <button class="modal-close" id="tutorialModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="section"><h5 id="tutorialPageTitle"></h5><div id="tutorialPageBody"></div></div>
        <div class="tutorial-controls">
          <div class="tutorial-page-indicator" id="tutorialPageIndicator"></div>
          <div class="tutorial-buttons">
            <button class="btn" id="tutorialPrevBtn"></button>
            <button class="btn primary" id="tutorialNextBtn"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const GRID=32;
      const OPEN_RESISTANCE=1e12;
      const IDEAL_WIRE_RESISTANCE=1e-9;
      const AMMETER_RESISTANCE=1e-6;
      const VOLTMETER_RESISTANCE=1e12;
      const SOLVER_EPS=1e-14;
      const HIT_R=72;
      const TERM_R=14;
      const CLICK_DRAG_THRESHOLD=4;
      const DOUBLE_CLICK_MS=320;
      const DEFAULT_BATTERY_VOLTAGE=1.5;
      const DEFAULT_BULB_RESISTANCE=20;
      const DEFAULT_RESISTOR_RESISTANCE=10;
      const ROTATE_STEP=15;
      const PROJECT_FILE_VERSION=10;
      const PLACE_SCALE=0.5;
      const SHORT_CURRENT_THRESHOLD=5;
      const LABEL_HIT_PAD=8;

      /*
       * Fixed display reference, not a circuit parameter.
       * A default 20 Ω bulb across a default 1.5 V ideal battery dissipates
       * 0.1125 W. All bulbs use the SAME reference, even when their resistance
       * differs. Adding/removing another bulb cannot rescale existing bulbs.
       */
      const BULB_REFERENCE_POWER=
        DEFAULT_BATTERY_VOLTAGE*DEFAULT_BATTERY_VOLTAGE/DEFAULT_BULB_RESISTANCE;

      function tutorialDiagram(zh){
        const labels=zh
          ?["目標","拆解","模式","規則","建構","測試","修正"]
          :["Goal","Break","Pattern","Rule","Build","Test","Revise"];
        return `
          <svg viewBox="0 0 460 260" aria-hidden="true">
            <rect x="16" y="22" width="94" height="54" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
            <text x="63" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">${labels[0]}</text>
            <rect x="132" y="22" width="94" height="54" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
            <text x="179" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">${labels[1]}</text>
            <rect x="248" y="22" width="94" height="54" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>

        const pos=getCompPos(c,useRender);
        if(c.isJunction)return [{x:pos.x,y:pos.y,componentId:c.id,side:"node"}];
        const sc=getCompScale(c),p1=rotatePoint(-56*sc,0,c.angle),p2=rotatePoint(56*sc,0,c.angle);
        return [
          {x:pos.x+p1.x,y:pos.y+p1.y,componentId:c.id,side:"left"},
          {x:pos.x+p2.x,y:pos.y+p2.y,componentId:c.id,side:"right"}
        ];
      }
      function getTerminalPosition(ref,useRender=false){
        const c=state.components.find(x=>x.id===ref.componentId);
        if(!c)return {x:0,y:0};
        const pos=getCompPos(c,useRender);
        if(c.isJunction||ref.side==="node")return pos;
        const sc=getCompScale(c);
        const local=rotatePoint(ref.side==="left"?-56*sc:56*sc,0,c.angle);
        return {x:pos.x+local.x,y:pos.y+local.y};
      }
      function terminalKey(componentId,side){return componentId+":"+side}
      function placementRectForType(type,x,y){
        const hr=type==="junction"?12:HIT_R*PLACE_SCALE;
        return {x1:x-hr,y1:y-hr,x2:x+hr,y2:y+hr};
      }
      function placementOverlaps(type,x,y,ignoreIds=new Set()){
        const r=placementRectForType(type,x,y);
        return state.components.some(c=>{
          if(ignoreIds.has(c.id))return false;
          if(type==="junction"&&c.isJunction)return Math.hypot(c.x-x,c.y-y)<GRID*0.5;
          return rectsOverlap(r,componentBounds(c,c.isJunction?6:12));
        });
      }
      function pathLength(path){
        let len=0;
        for(let i=0;i<path.length-1;i++)
          len+=Math.abs(path[i+1].x-path[i].x)+Math.abs(path[i+1].y-path[i].y);
        return len;
      }
      function segmentIntersectsRect(a,b,rect){
        if(a.x===b.x){
          const x=a.x,y1=Math.min(a.y,b.y),y2=Math.max(a.y,b.y);
          return x>=rect.x1&&x<=rect.x2&&!(y2<rect.y1||y1>rect.y2);
        }
        if(a.y===b.y){
          const y=a.y,x1=Math.min(a.x,b.x),x2=Math.max(a.x,b.x);
          return y>=rect.y1&&y<=rect.y2&&!(x2<rect.x1||x1>rect.x2);
        }
        return false;
      }
      function simplifyPath(points){
        const out=[];
        for(const p of points){
          const sp={x:snap(p.x),y:snap(p.y)},last=out[out.length-1];
          if(!last||last.x!==sp.x||last.y!==sp.y)out.push(sp);
        }
        if(out.length<3)return out;
        const reduced=[out[0]];
        for(let i=1;i<out.length-1;i++){
          const a=reduced[reduced.length-1],b=out[i],c=out[i+1];
          if(!((a.x===b.x&&b.x===c.x)||(a.y===b.y&&b.y===c.y)))reduced.push(b);
        }
        reduced.push(out[out.length-1]);return reduced;
      }
      function routePathBetweenPoints(start,end,ignoreComponentIds=new Set()){
        const sx=snap(start.x),sy=snap(start.y),ex=snap(end.x),ey=snap(end.y);
        if(sx===ex&&sy===ey)return [{x:sx,y:sy}];
        const offset=GRID*2;
        const candidates=[
          [{x:sx,y:sy},{x:ex,y:sy},{x:ex,y:ey}],
          [{x:sx,y:sy},{x:sx,y:ey},{x:ex,y:ey}],
          [{x:sx,y:sy},{x:sx+offset,y:sy},{x:sx+offset,y:ey},{x:ex,y:ey}],
          [{x:sx,y:sy},{x:sx-offset,y:sy},{x:sx-offset,y:ey},{x:ex,y:ey}],
          [{x:sx,y:sy},{x:sx,y:sy+offset},{x:ex,y:sy+offset},{x:ex,y:ey}],
          [{x:sx,y:sy},{x:sx,y:sy-offset},{x:ex,y:sy-offset},{x:ex,y:ey}]
        ];
        let best=null,bestScore=Infinity;
        for(const cand of candidates){
          const path=simplifyPath(cand);
          let penalty=path.length*12+pathLength(path);
          for(let i=0;i<path.length-1;i++){
            for(const c of state.components){
              if(ignoreComponentIds.has(c.id)||c.isJunction)continue;
              if(segmentIntersectsRect(path[i],path[i+1],componentBounds(c,10)))penalty+=100000;
            }
          }
          if(penalty<bestScore){bestScore=penalty;best=path}
        }
        return best||simplifyPath([{x:sx,y:sy},{x:ex,y:sy},{x:ex,y:ey}]);
      }
      function computeWirePath(from,to,useRender=false){
        const a=getTerminalPosition(from,useRender),b=getTerminalPosition(to,useRender);
        return routePathBetweenPoints(a,b,new Set([from.componentId,to.componentId]));
      }
      function pointProjectionOnSegment(p,a,b){
        const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
        if(len2===0)return {x:a.x,y:a.y,t:0,dist:Math.hypot(p.x-a.x,p.y-a.y)};
        const tt=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/len2));
        const proj={x:a.x+tt*dx,y:a.y+tt*dy};
        return {...proj,t:tt,dist:Math.hypot(p.x-proj.x,p.y-proj.y)};
      }
      function getNearestWirePoint(world,tolerance=12){
        let best=null;
        for(const wire of state.wires){
          const path=wire.path||computeWirePath(wire.from,wire.to);
          for(let i=0;i<path.length-1;i++){
            const proj=pointProjectionOnSegment(world,path[i],path[i+1]);
            if(proj.dist<=tolerance){
              const score=proj.dist;
              if(!best||score<best.score)
                best={wire,x:snap(proj.x),y:snap(proj.y),score};
            }
          }
        }
        return best;
      }
      function ensureJunctionAt(x,y){
        const sx=snap(x),sy=snap(y);
        const existing=state.components.find(c=>c.isJunction&&c.x===sx&&c.y===sy);
        if(existing)return existing;
        const nearby=getNearestWirePoint({x:sx,y:sy},14);
        if(!nearby||nearby.x!==sx||nearby.y!==sy){
          if(placementOverlaps("junction",sx,sy))return null;
        }
        const j=createComponent("junction",sx,sy);
        j.scale=1;state.components.push(j);return j;
      }
      function addWire(from,to){
        if(!from||!to)return false;
        if(from.componentId===to.componentId&&from.side===to.side)return false;
        const exists=state.wires.some(w=>
          (w.from.componentId===from.componentId&&w.from.side===from.side&&w.to.componentId===to.componentId&&w.to.side===to.side)||
          (w.from.componentId===to.componentId&&w.from.side===to.side&&w.to.componentId===from.componentId&&w.to.side===from.side)
        );
        if(exists)return false;
        state.wires.push({id:uid("w"),from:{...from},to:{...to},path:computeWirePath(from,to)});
        return true;
      }
      function rerouteAllWires(useRender=false){
        for(const w of state.wires)w.path=computeWirePath(w.from,w.to,useRender);
      }
      function clearSelection(){state.selectedComponents.clear();state.selectedWires.clear()}
      function pointOnSegment(p,a,b,eps=0.5){
        if(a.x===b.x)
          return Math.abs(p.x-a.x)<=eps&&p.y>=Math.min(a.y,b.y)-eps&&p.y<=Math.max(a.y,b.y)+eps;
        if(a.y===b.y)
          return Math.abs(p.y-a.y)<=eps&&p.x>=Math.min(a.x,b.x)-eps&&p.x<=Math.max(a.x,b.x)+eps;
        return false;
      }
      function splitWireAtPoint(wire,x,y){
        const path=wire.path||computeWirePath(wire.from,wire.to);
        let bestPoint=null;
        for(let i=0;i<path.length-1;i++){
          const proj=pointProjectionOnSegment({x,y},path[i],path[i+1]);
          if(proj.dist<=10){
            const sx=snap(proj.x),sy=snap(proj.y);
            const ea=snap(path[i].x)===sx&&snap(path[i].y)===sy;
            const eb=snap(path[i+1].x)===sx&&snap(path[i+1].y)===sy;
            const score=proj.dist+((ea||eb)?0.05:0);
            if(!bestPoint||score<bestPoint.score)bestPoint={x:sx,y:sy,score};
          }
        }
        if(!bestPoint)return null;
        const node=ensureJunctionAt(bestPoint.x,bestPoint.y);
        if(!node)return null;
        state.wires=state.wires.filter(w=>w.id!==wire.id);
        addWire(wire.from,{componentId:node.id,side:"node"});
        addWire({componentId:node.id,side:"node"},wire.to);
        return node;
      }

      /*
       * Electrical topology:
       * - A wire joins only its referenced terminals and explicit nodes on it.
       * - Crossing wires do not connect without a conducting node.
       * - Nearby terminals are NOT joined merely because they round to the
       *   same grid cell. Actual coincident terminals can still connect.
       */
      function getNodeGroups(){
        const parent=new Map();
        function make(k){if(!parent.has(k))parent.set(k,k)}
        function find(k){
          make(k);
          let root=k;
          while(parent.get(root)!==root)root=parent.get(root);
          while(parent.get(k)!==k){
            const next=parent.get(k);parent.set(k,root);k=next;
          }
          return root;
        }
        function union(a,b){
          const ra=find(a),rb=find(b);
          if(ra!==rb)parent.set(ra,rb);
        }

        const allTerminals=[];
        for(const c of state.components){
          for(const tt of getTerminals(c)){
            const key=terminalKey(tt.componentId,tt.side);
            make(key);allTerminals.push({...tt,key});
          }
        }
        const validKeys=new Set(allTerminals.map(tt=>tt.key));

        for(const w of state.wires){
          const fk=terminalKey(w.from.componentId,w.from.side);
          const tk=terminalKey(w.to.componentId,w.to.side);
          if(!validKeys.has(fk)||!validKeys.has(tk))continue;
          union(fk,tk);
          const path=w.path||computeWirePath(w.from,w.to);
          for(const c of state.components){
            if(!c.isJunction)continue;
            for(let i=0;i<path.length-1;i++){
              if(pointOnSegment({x:c.x,y:c.y},path[i],path[i+1],0.1)){
                union(terminalKey(c.id,"node"),fk);break;
              }
            }
          }
        }

        for(let i=0;i<allTerminals.length;i++){
          for(let j=i+1;j<allTerminals.length;j++){
            const a=allTerminals[i],b=allTerminals[j];
            if(Math.hypot(a.x-b.x,a.y-b.y)<=0.01)union(a.key,b.key);
          }
        }

        const groups=new Map();
        for(const tt of allTerminals){
          const root=find(tt.key);
          if(!groups.has(root))groups.set(root,[]);
          groups.get(root).push({componentId:tt.componentId,side:tt.side});
        }
        return groups;
      }

      function effectiveResistanceOf(c){
        if(c.type==="switch")return c.closed?IDEAL_WIRE_RESISTANCE:OPEN_RESISTANCE;
        if(c.type==="ammeter")return AMMETER_RESISTANCE;
        if(c.type==="voltmeter")return VOLTMETER_RESISTANCE;
        if(c.type==="battery")return null;
        const value=Number(c.resistance);
        return Number.isFinite(value)&&value>0
          ?Math.max(value,IDEAL_WIRE_RESISTANCE):IDEAL_WIRE_RESISTANCE;
      }

      /*
       * Rank-revealing, row-scaled Gaussian elimination.
       * Consistent redundant ideal-source equations are allowed.
       * Inconsistent equations and failed residual checks are rejected.
       * Variables not uniquely defined are identified rather than presented
       * as physically meaningful meter readings.
       */
      function solveLinearSystem(A,b){
        const n=A.length;
        if(n===0){
          const result=[];
          result.ambiguous=new Set();result.rankDeficient=false;
          return result;
        }
        if(b.length!==n||A.some(row=>row.length!==n))return null;

        const M=[];
        for(let i=0;i<n;i++){
          if(!Number.isFinite(b[i])||A[i].some(v=>!Number.isFinite(v)))return null;
          let scale=0;
          for(const v of A[i])scale=Math.max(scale,Math.abs(v));
          if(scale===0)scale=1;
          M.push([...A[i].map(v=>v/scale),b[i]/scale]);
        }

        const pivots=[];
        let row=0;
        for(let col=0;col<n&&row<n;col++){
          let pivot=row;
          for(let r=row+1;r<n;r++)
            if(Math.abs(M[r][col])>Math.abs(M[pivot][col]))pivot=r;
          if(Math.abs(M[pivot][col])<=SOLVER_EPS)continue;
          if(pivot!==row)[M[row],M[pivot]]=[M[pivot],M[row]];
          const div=M[row][col];
          for(let j=col;j<=n;j++)M[row][j]/=div;
          M[row][col]=1;
          for(let r=0;r<n;r++){
            if(r===row)continue;
            const factor=M[r][col];
            if(factor===0)continue;
            for(let j=col+1;j<=n;j++)M[r][j]-=factor*M[row][j];
            M[r][col]=0;
          }
          pivots.push(col);row++;
        }

        for(let r=row;r<n;r++){
          let maxCoefficient=0;
          for(let j=0;j<n;j++)maxCoefficient=Math.max(maxCoefficient,Math.abs(M[r][j]));
          if(maxCoefficient<=SOLVER_EPS&&Math.abs(M[r][n])>1e-10)return null;
        }

        const result=Array(n).fill(0);
        for(let r=0;r<pivots.length;r++)result[pivots[r]]=M[r][n];
        if(result.some(v=>!Number.isFinite(v)))return null;

        const pivotSet=new Set(pivots);
        const free=[];
        for(let j=0;j<n;j++)if(!pivotSet.has(j))free.push(j);
        const ambiguous=new Set(free);
        for(let r=0;r<pivots.length;r++){
          if(free.some(col=>Math.abs(M[r][col])>1e-10))
            ambiguous.add(pivots[r]);
        }

        for(let i=0;i<n;i++){
          let computed=0,magnitude=Math.abs(b[i]);
          for(let j=0;j<n;j++){
            const term=A[i][j]*result[j];
            computed+=term;magnitude+=Math.abs(term);
          }
          if(Math.abs(computed-b[i])>1e-8*Math.max(1,magnitude))return null;
        }
        result.ambiguous=ambiguous;
        result.rankDeficient=free.length>0;
        return result;
      }

      function readingSolveLinear(A,b){return solveLinearSystem(A,b)}
      function readingR(e){return effectiveResistanceOf(e.component)}
      function readingConductive(e){
        return e.component.type!=="voltmeter"&&
          !(e.component.type==="switch"&&!e.component.closed);
      }

      function readingTopology(){
        const groups=getNodeGroups(),terminalNode=new Map();
        let index=0;
        for(const list of groups.values()){
          for(const item of list)
            terminalNode.set(terminalKey(item.componentId,item.side),index);
          index++;
        }
        const edges=[];
        for(const c of state.components){
          if(c.isJunction)continue;
          const a=terminalNode.get(terminalKey(c.id,"left"));
          const b=terminalNode.get(terminalKey(c.id,"right"));
          if(a==null||b==null)continue;

          /*
           * Drawn battery: left is negative, right is positive.
           * All branch quantities use left-to-right reference:
           * V(left) - V(right) = -sourceVoltage.
           */
          edges.push({
            id:c.id,component:c,a,b,
            r:c.type==="battery"?0:effectiveResistanceOf(c),
            v:c.type==="battery"?-(Number(c.sourceVoltage)||0):0,
            isBattery:c.type==="battery"
          });
        }
        return {edges,terminalNode,groups,nodeCount:index};
      }

      function readingIsland(edges,start){
        const nodes=new Set([start]),queue=[start];
        const adjacency=new Map();
        for(const e of edges){
          if(!readingConductive(e))continue;
          if(!adjacency.has(e.a))adjacency.set(e.a,[]);
          if(!adjacency.has(e.b))adjacency.set(e.b,[]);
          adjacency.get(e.a).push(e.b);adjacency.get(e.b).push(e.a);
        }
        for(let i=0;i<queue.length;i++){
          for(const other of adjacency.get(queue[i])||[]){
            if(!nodes.has(other)){nodes.add(other);queue.push(other)}
          }
        }
        return nodes;
      }

      /*
       * Shared modified nodal analysis with explicit branch-current unknowns.
       *
       * KCL: sum of branch currents at every non-reference node = 0.
       * Resistor: Va - Vb - R*I = 0.
       * Battery:  Va - Vb = specified signed voltage.
       *
       * Keeping I as an unknown avoids subtracting almost-equal node voltages
       * to find ammeter current and avoids 1e9 S closed-switch stamps.
       * Main simulation and explanation use exactly this same engine.
       */
      function readingMNA(nodes,resistors,sources,ground){
        const unknown=[...nodes].filter(n=>n!==ground);
        const map=new Map(unknown.map((n,i)=>[n,i]));
        const branches=[...resistors,...sources];
        const nv=unknown.length,size=nv+branches.length;
        const A=Array.from({length:size},()=>Array(size).fill(0));
        const rhs=Array(size).fill(0);

        branches.forEach((e,k)=>{
          const row=nv+k,ia=map.get(e.a),ib=map.get(e.b);
          if(ia!=null){A[ia][row]+=1;A[row][ia]+=1}
          if(ib!=null){A[ib][row]-=1;A[row][ib]-=1}
          if(k<resistors.length){
            if(!Number.isFinite(e.r)||e.r<=0)return;
            A[row][row]=-e.r;
          }else rhs[row]=e.v;
        });
        if(resistors.some(e=>!Number.isFinite(e.r)||e.r<=0))return null;

        const solution=solveLinearSystem(A,rhs);
        if(!solution)return null;

        const voltages=new Map([[ground,0]]),currents=new Map();
        const ambiguousNodes=new Set(),ambiguousCurrents=new Set();
        unknown.forEach((n,i)=>{
          voltages.set(n,solution[i]);
          if(solution.ambiguous.has(i))ambiguousNodes.add(n);
        });
        branches.forEach((e,k)=>{
          currents.set(e.id,solution[nv+k]);
          if(solution.ambiguous.has(nv+k))ambiguousCurrents.add(e.id);
        });
        return {
          voltages,currents,ground,ambiguousNodes,ambiguousCurrents,
          rankDeficient:solution.rankDeficient
        };
      }

      function sourceHasShortPath(source,edges){
        if(source.a===source.b)return Math.abs(source.v)>1e-12;
        const lowResistanceEdges=edges.filter(e=>
          e.component.type==="ammeter"||
          (e.component.type==="switch"&&e.component.closed)
        );
        const reachable=readingIsland(lowResistanceEdges,source.a);
        return reachable.has(source.b)&&Math.abs(source.v)>1e-12;
      }

      function solveCircuit(){
        for(const c of state.components){
          c.current=0;c.voltage=0;c.power=0;c.branchVoltage=0;
          c.electricalValid=false;c.currentValid=false;c.voltageValid=false;
        }

        const topology=readingTopology();
        const {edges,terminalNode,groups,nodeCount}=topology;
        const nodeVoltages=Array(nodeCount).fill(NaN);
        const nodeIsland=Array(nodeCount).fill(-1);
        const islands=[],componentIsland=new Map(),visited=new Set();
        const nodeOfTerminal=(id,side)=>terminalNode.get(terminalKey(id,side))??null;

        let anySolved=false,anyComplete=false,anyShort=false,anyFailure=false;

        for(let start=0;start<nodeCount;start++){
          if(visited.has(start))continue;
          const nodes=readingIsland(edges,start);
          for(const n of nodes)visited.add(n);
          const islandEdges=edges.filter(e=>nodes.has(e.a)&&nodes.has(e.b));
          const batteries=islandEdges.filter(e=>e.isBattery);
          const resistive=islandEdges.filter(e=>!e.isBattery&&readingConductive(e));
          const ground=batteries.length?batteries[0].b:start;
          const isShort=batteries.some(e=>sourceHasShortPath(e,islandEdges));
          const solution=readingMNA(nodes,resistive,batteries,ground);
          const idx=islands.length;
          const island={
            nodes,edges:islandEdges,batteries,resistive,
            solved:!!solution,open:true,isShort,solution
          };
          islands.push(island);
          for(const n of nodes)nodeIsland[n]=idx;
          for(const e of islandEdges)componentIsland.set(e.id,idx);

          if(isShort)anyShort=true;
          if(!solution){
            anyFailure=true;
            /*
             * An inconsistent loop made solely from ideal batteries/wires
             * is not an ordinary open circuit. Its ideal-source constraints
             * are incompatible and no finite operating point exists.
             */
            if(batteries.length>1){
              const sourceOnlyNodes=readingIsland(batteries,batteries[0].a);
              const sourceOnly=batteries.filter(e=>
                sourceOnlyNodes.has(e.a)&&sourceOnlyNodes.has(e.b));
              if(!readingMNA(sourceOnlyNodes,[],sourceOnly,batteries[0].b)){
                island.sourceConflict=true;
              }
            }
            continue;
          }

          if(batteries.length)anySolved=true;

          for(const [n,v] of solution.voltages){
            if(!solution.ambiguousNodes.has(n))nodeVoltages[n]=v;
          }

          for(const e of [...resistive,...batteries]){
            const c=e.component;
            const current=solution.currents.get(e.id)||0;
            const currentValid=!solution.ambiguousCurrents.has(e.id);
            const va=nodeVoltages[e.a],vb=nodeVoltages[e.b];
            const voltageValid=Number.isFinite(va)&&Number.isFinite(vb);
            /*
             * R*I is accurate even for tiny ammeter/switch voltage drops.
             * Source voltage is prescribed by the battery equation.
             */
            const vdrop=e.isBattery?e.v:e.r*current;
            c.current=currentValid?current:0;
            c.currentValid=currentValid;
            c.branchVoltage=voltageValid?vdrop:0;
            c.voltage=voltageValid?Math.abs(vdrop):0;
            c.voltageValid=voltageValid;
            c.electricalValid=currentValid&&voltageValid;
            c.power=c.electricalValid
              ?(e.isBattery?Math.abs(vdrop*current):current*current*e.r):0;
          }

          const delivered=batteries.some(e=>{
            const c=e.component;
            return c.currentValid&&Math.abs(c.current)>1e-12;
          });
          island.open=!delivered;
          if(batteries.length&&delivered)anyComplete=true;
        }

        /*
         * An ideal voltmeter and an open switch carry no current.
         * Their voltage is meaningful only within one solved electrical
         * island, not between independently grounded floating networks.
         */
        for(const e of edges){
          const c=e.component;
          if(c.type!=="voltmeter"&&!(c.type==="switch"&&!c.closed))continue;
          c.current=0;c.currentValid=true;c.power=0;
          const sameIsland=nodeIsland[e.a]===nodeIsland[e.b];
          const island=islands[nodeIsland[e.a]];
          const va=nodeVoltages[e.a],vb=nodeVoltages[e.b];
          const valid=sameIsland&&island?.solved&&Number.isFinite(va)&&Number.isFinite(vb);
          c.voltageValid=!!valid;c.electricalValid=!!valid;
          c.branchVoltage=valid?va-vb:0;
          c.voltage=valid?Math.abs(va-vb):0;

            pairs.get(key).push(e);
          }
          for(const list of pairs.values()){
            if(list.length<2)continue;
            const replacement=combine("parallel",list,list[0].a,list[0].b);
            const removed=new Set(list);
            edges=edges.filter(e=>!removed.has(e));edges.push(replacement);
            changed=true;break;
          }
          if(changed)continue;
          const nodes=[...new Set(edges.flatMap(e=>[e.a,e.b]))];
          for(const n of nodes){
            if(n===a||n===b)continue;
            const list=edges.filter(e=>e.a===n||e.b===n);
            if(list.length===1){
              discarded.push(list[0]);edges=edges.filter(e=>e!==list[0]);changed=true;break;
            }
            if(list.length===2){
              const x=list[0].a===n?list[0].b:list[0].a;
              const y=list[1].a===n?list[1].b:list[1].a;
              if(x===y)continue;
              const replacement=combine("series",list,x,y);
              edges=edges.filter(e=>e!==list[0]&&e!==list[1]);edges.push(replacement);
              changed=true;break;
            }
          }
          if(!changed)break;
        }
        const root=edges.length===1&&
          ((edges[0].a===a&&edges[0].b===b)||(edges[0].a===b&&edges[0].b===a))
          ?edges[0]:null;
        return {root,operations,discarded,remaining:edges};
      }
      function readingLeaves(tree){
        return tree.kind==="leaf"?[tree.component]:tree.children.flatMap(readingLeaves);
      }
      function readingTreeNames(tree){return readingLeaves(tree).map(componentShortName).join(" + ")}
      function readingAssignNames(root){
        let p=0;
        function visit(e){
          if(e.kind==="parallel")e.label="P"+(++p);
          for(const child of e.children)visit(child);
        }
        if(root)visit(root);
      }
      function readingTreeSymbol(e){
        if(e.kind==="leaf")return readingVar("R",componentShortName(e.component));
        if(e.kind==="parallel")return readingVar("R",e.label||"parallel");
        return "("+e.children.map(readingTreeSymbol).join(" + ")+")";
      }
      function readingPostorder(e){return [...e.children.flatMap(readingPostorder),e]}
      function readingTreePredictions(root,voltage){
        const results=new Map();
        function distribute(e,v){
          const i=v/e.r;results.set(e,{v,i});
          if(e.kind==="series"){
            for(const child of e.children)distribute(child,i*child.r);
          }else if(e.kind==="parallel"){
            for(const child of e.children)distribute(child,v);
          }
        }
        distribute(root,Math.abs(voltage));return results;
      }
      function readingBuildModel(c){
        const topology=state.lastPhysics?.topology||readingTopology();
        const meter=topology.edges.find(e=>e.id===c.id);
        if(!meter)return {error:readingText("The meter has no valid terminal pair.","儀表沒有有效的兩端節點。")};
        const nodes=readingIsland(topology.edges,meter.a);
        if(!nodes.has(meter.b)){
          return {error:readingText(
            "The two meter terminals are in different electrically isolated networks. Their relative voltage is undefined. A dash is shown instead of an invented voltage reading.",
            "儀表兩端位於不同且互相隔離的電路，兩者的相對電壓沒有定義，因此顯示橫線，而不是虛構電壓讀值。"
          )};
        }
        const relevant=topology.edges.filter(e=>nodes.has(e.a)&&nodes.has(e.b));
        const sources=relevant.filter(e=>e.isBattery);
        const resistors=relevant.filter(e=>readingConductive(e)&&!e.isBattery);
        if(!sources.length)
          return {error:readingText("No battery supplies this meter's network.","此儀表所在的電路沒有電池供電。")};
        const prediction=readingMNA(nodes,resistors,sources,sources[0].b);
        if(!prediction){
          return {error:readingText(
            "No finite operating point exists for these ideal-source constraints, or the system could not be resolved numerically. Check for a battery directly shorted by a wire or incompatible ideal batteries. Undefined readings are shown as dashes.",
            "此理想電源條件沒有有限的工作點，或系統無法完成數值求解。請檢查電池是否被導線直接短接，以及理想電池是否互相矛盾。未定義的讀值會顯示橫線。"
          )};
        }
        if(c.type==="ammeter"&&prediction.ambiguousCurrents.has(c.id)){
          return {error:readingText(
            "This meter current is not uniquely determined by the ideal circuit constraints. Check redundant ideal-source loops.",
            "此儀表電流無法由理想電路條件唯一決定，請檢查重複的理想電源迴路。"
          )};
        }
        const port=readingSourcePort(sources,resistors);
        const reduction=port?readingReduce(resistors,port.a,port.b):null;
        const root=reduction?.root||null;
        if(root)readingAssignNames(root);
        const equivalent=port?(root?root.r:readingEquivalent(resistors,port.a,port.b)):null;
        const totalI=port&&equivalent!=null
          ?(equivalent===Infinity?0:equivalent>0?Math.abs(port.v)/equivalent:NaN):null;
        const treeResults=root?readingTreePredictions(root,port.v):null;
        const predictedReading=c.type==="ammeter"
          ?Math.abs(prediction.currents.get(c.id)||0)
          :Math.abs(prediction.voltages.get(meter.a)-prediction.voltages.get(meter.b));
        return {
          meter,nodes,relevant,sources,resistors,prediction,port,reduction,root,
          equivalent,totalI,treeResults,predictedReading
        };
      }

      function readingParallelStep(model){
        const {root}=model;
        if(!root){
          const rows=model.resistors.filter(e=>!["ammeter","switch"].includes(e.component.type))
            .map(e=>`<tr><td>${componentShortName(e.component)}</td><td>N${e.a+1} ↔ N${e.b+1}</td><td>${readingNumber(e.r)} Ω</td></tr>`);
          return `<p>${readingText(
            "First, list the resistances and node connections. This network cannot be represented as one verified series–parallel reduction, or it has independent source connections. We therefore use Kirchhoff’s laws rather than incorrectly adding unrelated branches.",
            "先列出電阻與節點連接。此電路不能完全化簡成單一、經驗證的串並聯結構，或含有獨立電源連接，因此使用基爾霍夫定律，避免把不相關支路錯誤相加。"
          )}</p>${readingTable(
            [readingText("Component","元件"),readingText("Connected nodes","連接節點"),readingText("Resistance","電阻")],rows
          )}`;
        }
        const parallels=readingPostorder(root).filter(e=>e.kind==="parallel");
        if(!parallels.length){
          return `<p>${readingText(
            "There is no parallel section in this conducting path. All loads in the reduced main path are in series.",
            "此導通路徑沒有並聯部分，化簡後的主路徑負載全部串聯。"
          )}</p>${readingMath(
            readingVar("R","series")+" = "+readingLeaves(root).map(c=>readingVar("R",componentShortName(c))).join(" + ")+" = "+
            readingLeaves(root).map(c=>readingNumber(readingR({component:c}))+" Ω").join(" + ")+
            " ≈ <strong>"+readingNumber(root.r,4)+" Ω</strong>"
          )}`;
        }
        let html=`<p>${readingText(
          "First, identify parallel paths by their common start and end nodes. Add series resistances within each path, then combine the parallel branches. For nested networks, simplify the innermost parallel section first.",
          "先根據共同的起點與終點辨認並聯路徑，把每條支路內的串聯電阻相加，再合併並聯支路。若有巢狀結構，先化簡最內層並聯部分。"
        )}</p>`;
        for(const p of parallels){
          html+=`<div class="reading-subsection"><h6>${readingText("Parallel section","並聯部分")} ${p.label}</h6><ul>`;
          p.children.forEach((branch,i)=>{
            const branchName=`${p.label}.${i+1}`;
            html+=`<li><strong>${t("branchLabel")(i+1)} (${readingTreeNames(branch)}):</strong> ${
              readingText(
                branch.kind==="series"?"These elements are in series, so their equivalent resistances add.":"Use the component resistance or the equivalent resistance already calculated for this subnetwork.",
                branch.kind==="series"?"這些部分串聯，因此把它們的等效電阻相加。":"使用此元件的電阻，或此子電路已求得的等效電阻。"
              )
            }${readingMath(
              readingVar("R",branchName)+" = "+readingTreeSymbol(branch)+" = "+
              (branch.kind==="series"?branch.children.map(ch=>readingNumber(ch.r)+" Ω").join(" + "):readingNumber(branch.r)+" Ω")+
              " ≈ <strong>"+readingNumber(branch.r,4)+" Ω</strong>"
            )}</li>`;
          });
          html+=`</ul><p>${readingText("Now combine these parallel branches into a single equivalent resistance:","現在把這些並聯支路合併成單一等效電阻：")}</p>`;
          html+=readingMath(
            readingFrac("1",readingVar("R",p.label))+" = "+
            p.children.map((branch,i)=>readingFrac("1",readingVar("R",p.label+"."+(i+1)))).join(" + ")+" = "+
            p.children.map(branch=>readingFrac("1",readingNumber(branch.r))).join(" + ")
          );
          html+=readingMath(
            readingVar("R",p.label)+" = "+
            readingFrac("1",p.children.map(branch=>readingFrac("1",readingNumber(branch.r))).join(" + "))+
            " ≈ <strong>"+readingNumber(p.r,4)+" Ω</strong>"
          )+"</div>";
        }
        return html;
      }

      function readingTotalResistanceStep(model){
        const {root,port,equivalent}=model;
        if(!port){
          return `<p>${readingText(
            "The sources are not a single untapped series battery chain. A single “total resistance” and a summed battery voltage would be misleading. Each source sees its own driving-point resistance.",
            "電源並非單一、無分支接點的串聯電池組，因此不能直接把所有電池電壓相加或指定一個總電阻。各電源具有各自所見的輸入等效電阻。"
          )}</p>${readingMath(
            readingVar("R","in,k")+" = "+readingFrac(readingVar("V","test"),readingVar("I","test"))+
            readingText(" &nbsp; (other independent voltage sources set to 0 V)"," &nbsp;（其他獨立電壓源設為 0 V）")
          )}<p>${readingText(
            "The simultaneous source-and-node calculation in Steps 3–4 predicts the actual currents and voltages without inventing a global series–parallel structure.",
            "步驟 3–4 同時求解各電源與節點，準確預測電流和電壓，而不虛構整體串並聯結構。"
          )}</p>`;
        }
        if(equivalent===Infinity){
          return `<p>${readingText(
            "There is no closed resistive return path between the source terminals. An open switch or disconnected branch breaks the circuit.",
            "電源兩端之間沒有閉合的電阻回路，可能由未閉合開關或斷開支路造成。"
          )}</p>${readingMath(readingVar("R","total")+" = ∞ Ω")}`;
        }
        if(equivalent==null){
          return `<p>${readingText("The equivalent-resistance test could not be solved.","等效電阻測試未能完成求解。")}</p>`;
        }
        if(root){
          const parts=root.kind==="series"?root.children:[root];
          return `<p>${readingText(
            root.kind==="series"?"The reduced parallel sections and the remaining series elements are in series. Add their equivalent resistances to find the total circuit resistance:":"The reduced network spans the two source terminals, so its equivalent resistance is the total circuit resistance:",
            root.kind==="series"?"化簡後的並聯部分與其餘元件串聯，把它們的等效電阻相加，得到全電路總電阻：":"化簡後的電路跨接電源兩端，因此其等效電阻就是全電路總電阻："
          )}</p>${readingMath(
            readingVar("R","total")+" = "+parts.map(readingTreeSymbol).join(" + ")+" = "+
            parts.map(e=>readingNumber(e.r)+" Ω").join(" + ")+
            " ≈ <strong>"+readingNumber(equivalent,4)+" Ω</strong>"
          )}`;
        }
        return `<p>${readingText(
          "A bridge or other non-reducible network requires nodal analysis. Apply a separate 1 V test source across the source port and solve the resistor network; this calculates resistance independently of the live meter readings.",
          "橋式或其他不能直接串並聯化簡的電路須使用節點分析。另在電源端口施加 1 V 測試電源，求解電阻網絡；此方法不使用現有儀表讀值來反推電阻。"
        )}</p>${readingMath(
          readingVar("R","total")+" = "+readingFrac(readingVar("V","test"),readingVar("I","test"))+" = "+
          readingFrac("1 V",readingNumber(1/equivalent)+" A")+
          " ≈ <strong>"+readingNumber(equivalent,4)+" Ω</strong>"
        )}`;
      }
      function readingSourceVoltageFormula(port){
        return port.terms.map((term,i)=>{
          const value=term.sign*term.edge.v;
          return (i?(value<0?" − ":" + "):(value<0?"−":""))+
            readingNumber(Math.abs(value))+" V";
        }).join("");
      }
      function readingTotalCurrentStep(model){
        let html="";
        if(model.port){
          html+=`<p>${readingText(
            "Combine battery voltages according to their actual series connections and polarities. The drawn right terminal is positive. Then use Ohm’s law to predict the source-current magnitude:",
            "根據電池實際串聯連接及極性合併電壓。圖中的右端為正極，再使用歐姆定律預測電源電流大小："
          )}</p>`;
          html+=readingMath(
            readingVar("V","total")+" = |"+readingSourceVoltageFormula(model.port)+"| = <strong>"+
            readingNumber(Math.abs(model.port.v))+" V</strong>"
          );
          html+=readingMath(
            readingVar("I","total")+" = "+readingFrac(readingVar("V","total"),readingVar("R","total"))+" = "+
            readingFrac(readingNumber(Math.abs(model.port.v))+" V",readingNumber(model.equivalent)+" Ω")+
            " ≈ <strong>"+readingNumber(model.totalI)+" A</strong>"
          );
          if(model.root){
            const mainMeters=readingLeaves(model.root).filter(c=>{
              if(c.type!=="ammeter")return false;
              function belongsToParallel(e){
                if(e.kind==="parallel"&&e.ids.has(c.id))return true;
                return e.children.some(belongsToParallel);
              }
              return !belongsToParallel(model.root);
            });
            if(mainMeters.length){
              html+=`<ul><li>${readingText(
                "Main-path ammeter(s) "+mainMeters.map(componentShortName).join(", ")+" therefore measure the total current.",
                "主路徑電流表 "+mainMeters.map(componentShortName).join("、")+" 因此量度總電流。"
              )}</li></ul>`;
            }
          }
        }else{
          html+=`<p>${readingText(
            "For independent or tapped sources, solve all source constraints together. Battery voltages are not simply added:",
            "對於獨立或有分支接點的電源，須同時求解所有電源條件，不能把電池電壓直接相加："
          )}</p>`;
          for(const s of model.sources){
            html+=readingMath(
              readingVar("V","N"+(s.a+1))+" − "+readingVar("V","N"+(s.b+1))+" = "+readingNumber(s.v)+" V"
            );
          }
        }
        if(!model.root){
          html+=`<p>${readingText(
            "At each ordinary node, the algebraic sum of currents is zero. The source constraints and these equations form the simultaneous nodal calculation:",
            "在每個普通節點，流入與流出電流的代數和為零。這些方程與電源條件構成聯立節點方程："
          )}</p>`;
          html+=readingMath(
            "Σ "+readingFrac(readingVar("V","i")+" − "+readingVar("V","j"),readingVar("R","ij"))+
            " + Σ "+readingVar("I","source")+" = 0"
          );
        }
        const rows=model.sources.map(s=>{
          const value=model.prediction.ambiguousCurrents.has(s.id)?NaN:model.prediction.currents.get(s.id);
          return `<tr><td>${componentShortName(s.component)}</td><td>${readingNumber(s.component.sourceVoltage)} V</td><td>${readingNumber(value)} A</td></tr>`;
        });
        html+=readingTable(
          [readingText("Source","電源"),readingText("Source voltage","電源電壓"),
           readingText("Predicted current, left → right","預測電流，左端 → 右端")],rows
        );
        html+=`<p>${readingText(
          "Signed currents use the component’s local left-to-right direction. A negative sign means flow in the opposite direction; the meter labels display magnitudes.",
          "帶正負號的電流以元件本身的左端到右端為參考方向。負號表示反向流動，儀表標籤則顯示大小。"
        )}</p>`;
        return html;
      }
      function readingBranchStep(model,c){
        let html=`<p>${readingText(
          "Use the calculated total current to work back through the network. Series elements carry the same current; parallel branches have the same voltage across their common endpoints.",
          "由已求得的總電流逐層回推。串聯元件具有相同電流；並聯支路在共同兩端節點之間具有相同電壓。"
        )}</p>`;
        if(model.root){
          const results=model.treeResults;
          function explain(e){
            if(e.kind==="leaf")return "";
            let out="";
            const result=results.get(e);
            if(e.kind==="series"){
              out+=`<p>${readingText(
                "For the series section ("+readingTreeNames(e)+"), predict each voltage drop:",

              for(const child of e.children){
                const cr=results.get(child);
                out+=readingMath(
                  readingVar("V",child.kind==="parallel"?child.label:readingTreeNames(child))+" = "+
                  readingVar("I","series")+" × "+readingTreeSymbol(child)+" = "+

            }else{
              out+=`<div class="reading-subsection"><h6>${readingText("Parallel section","並聯部分")} ${e.label}</h6>`;
              out+=readingMath(
                readingVar("V",e.label)+" = "+readingVar("I",e.label)+" × "+readingVar("R",e.label)+" = "+
                readingNumber(result.i)+" × "+readingNumber(e.r)+
                " ≈ <strong>"+readingNumber(result.v)+" V</strong>"
              );
              out+=`<p>${readingText(
                "This voltage is common to every branch in this section. The current divides inversely with branch resistance:",
                "此電壓是此並聯部分各支路的共同電壓，電流按支路電阻的倒數比例分配："
              )}</p>`;
              e.children.forEach((branch,i)=>{
                const br=results.get(branch),name=e.label+"."+(i+1);

                  readingVar("I",name)+" = "+readingFrac(readingVar("V",e.label),readingVar("R",name))+" = "+

                    " = "+readingNumber(result.i)+" × "+
                    readingFrac(readingNumber(other.r),readingNumber(e.children[0].r)+" + "+readingNumber(e.children[1].r))+
                    " ≈ <strong>"+readingNumber(br.i)+" A</strong>"
                  );
                }else{
                  out+=readingMath(
                    readingVar("I",name)+" = "+readingVar("I",e.label)+" × "+
                    readingFrac("1 / "+readingVar("R",name),"Σ (1 / "+readingVar("R","branch")+")")+
                    " ≈ <strong>"+readingNumber(br.i)+" A</strong>"
                  );
                }
              });
              out+=readingMath(
                "Σ "+readingVar("I","branch")+" = "+
                e.children.map(branch=>readingNumber(results.get(branch).i)).join(" + ")+
                " ≈ <strong>"+readingNumber(result.i)+" A</strong>"
              )+"</div>";
            }
            return out+e.children.map(explain).join("");
          }
          html+=explain(model.root);
        }else{
          html+=`<p>${readingText(
            "For a bridge network, each component edge is a branch between its own two nodes. Use the predicted node voltages and that branch’s resistance:",
            "在橋式電路，每個元件形成其兩端節點之間的一條支路，使用預測節點電壓和該支路電阻求解："
          )}</p>`;
          html+=readingMath(
            readingVar("V","branch")+" = "+readingVar("V","a")+" − "+readingVar("V","b")+", &nbsp; "+
            readingVar("I","branch")+" = "+readingFrac(readingVar("V","branch"),readingVar("R","branch"))
          );
          const rows=[...model.nodes].sort((a,b)=>a-b).map(n=>
            `<tr><td>N${n+1}${n===model.prediction.ground?" ("+readingText("reference","基準")+")":""}</td><td>${readingNumber(model.prediction.voltages.get(n))} V</td></tr>`
          );
          html+=readingTable([readingText("Node","節點"),readingText("Predicted potential","預測電位")],rows);
        }

        const branchRows=model.resistors.map(e=>{
          const current=model.prediction.ambiguousCurrents.has(e.id)
            ?NaN:Math.abs(model.prediction.currents.get(e.id)||0);
          const v=current*e.r;
          return `<tr${e.id===c.id?' class="selected-meter-row"':""}><td>${componentShortName(e.component)}</td><td>${readingNumber(e.r)} Ω</td><td>${readingNumber(v)} V</td><td>${readingNumber(current)} A</td></tr>`;
        });
        html+=`<p><strong>${readingText("Predicted component / branch values","各元件／支路的預測值")}</strong></p>`;
        html+=readingTable(
          [readingText("Component","元件"),readingText("Resistance","電阻"),
           readingText("Voltage magnitude","電壓大小"),readingText("Current magnitude","電流大小")],branchRows
        );

        /*
         * Explain bulb power explicitly, including an ammeter shunting a load.
         * Scientific notation preserves very small nonzero leakage-like
         * currents through branches bypassed by finite-resistance ammeters.
         */
        const bulbRows=model.resistors.filter(e=>e.component.type==="bulb").map(e=>{
          const current=Math.abs(model.prediction.currents.get(e.id)||0);
          const power=current*current*e.r;
          return `<tr><td>${componentShortName(e.component)}</td><td>${readingNumber(current)} A</td><td>${readingNumber(power)} W</td></tr>`;
        });
        if(bulbRows.length){
          html+=`<div class="reading-subsection"><h6>${readingText("Bulb brightness follows power","燈泡亮度取決於功率")}</h6>`;
          html+=readingMath(
            readingVar("P","bulb")+" = "+readingVar("I","bulb")+"² "+readingVar("R","bulb")+" = "+
            readingFrac(readingVar("V","bulb")+"²",readingVar("R","bulb"))
          );
          html+=readingTable(
            [readingText("Bulb","燈泡"),readingText("Current","電流"),readingText("Electrical power","電功率")],bulbRows
          );

      function hitComponent(world){

        for(let i=state.components.length-1;i>=0;i--){

            return {component:c,kind:"batteryVoltage"};
          if(c.type==="bulb"&&insideRect(world,getValueLabelRectForComponent(c,null,true)))
            return {component:c,kind:"bulbResistanceLabel"};

          !wireIds.has(w.id)&&!compIds.has(w.from.componentId)&&!compIds.has(w.to.componentId));

      function addComponentAt(type,p){
        const x=snap(p.x),y=snap(p.y);
        if(type==="junction"){
          const near=getNearestWirePoint({x,y},14);
          if(near){
            pushHistory();
            const node=splitWireAtPoint(near.wire,near.x,near.y);
            if(!node)return false;
            clearSelection();state.selectedComponents.add(node.id);solveAndRender();return true;
          }
        }
        if(placementOverlaps(type,x,y))return false;
        pushHistory();
        const c=createComponent(type,x,y);state.components.push(c);
        clearSelection();state.selectedComponents.add(c.id);solveAndRender();return true;
      }
      function candidateAnglesFromTerminal(type,anchorRef){
        const c=state.components.find(x=>x.id===anchorRef.componentId);
        if(!c)return [0,180,90,-90];
        const base=c.angle||0;
        if(type==="battery"&&c.type==="battery"&&["left","right"].includes(anchorRef.side))
          return [base,base+90,base-90,base+180];
        if(anchorRef.side==="left")
          return [base+180,base+135,base-135,base+90,base-90,base,base+45,base-45];
        if(anchorRef.side==="right")
          return [base,base+45,base-45,base+90,base-90,base+180,base+135,base-135];
        return [0,180,90,-90,45,-45,135,-135];
      }
      function findPlacementFromTerminal(type,anchorRef){
        const anchor=getTerminalPosition(anchorRef);
        const angles=candidateAnglesFromTerminal(type,anchorRef),distances=[72,96,128,160,192];
        for(const dist of distances){
          for(const ang0 of angles){
            const ang=normalizeComponentAngle(type,ang0),dir=rotatePoint(dist,0,ang);
            const x=snap(anchor.x+dir.x),y=snap(anchor.y+dir.y);
            if(placementOverlaps(type,x,y))continue;
            const temp=createComponent(type,x,y);temp.angle=ang;
            let bestTerminal=null,bestDist=Infinity;
            for(const tt of getTerminals(temp)){
              const d=Math.hypot(tt.x-anchor.x,tt.y-anchor.y);
              if(d<bestDist){bestDist=d;bestTerminal=tt}
            }
            if(!bestTerminal)continue;
            if(type==="battery"&&anchorRef.side==="left"){
              const existing=state.components.find(xx=>xx.id===anchorRef.componentId);
              if(existing&&existing.type==="battery"){
                temp.angle=existing.angle;
                bestTerminal=getTerminals(temp).reduce((acc,tt)=>{
                  const d=Math.hypot(tt.x-anchor.x,tt.y-anchor.y);
                  return !acc||d<acc.d?{...tt,d}:acc;
                },null);
                return {x,y,angle:temp.angle,terminalSide:bestTerminal.side};
              }
            }
            return {x,y,angle:ang,terminalSide:bestTerminal.side};
          }
        }
        return null;
      }
      function addComponentFromExistingTerminal(type,anchorRef){
        const place=findPlacementFromTerminal(type,anchorRef);
        if(!place)return false;
        pushHistory();
        const c=createComponent(type,place.x,place.y);
        c.angle=normalizeComponentAngle(c.type,place.angle);c.renderX=c.x;c.renderY=c.y;
        state.components.push(c);addWire(anchorRef,{componentId:c.id,side:place.terminalSide});
        clearSelection();state.selectedComponents.add(c.id);solveAndRender();return true;
      }
      function zoomAt(screenPoint,factor){
        const oldScale=state.view.scale;
        const newScale=Math.max(state.view.minScale,Math.min(state.view.maxScale,oldScale*factor));
        if(newScale===oldScale)return;
        const worldBefore=screenToWorld(screenPoint);state.view.scale=newScale;
        state.view.offsetX=screenPoint.x-worldBefore.x*newScale;
        state.view.offsetY=screenPoint.y-worldBefore.y*newScale;render();

      function rotateSelected(delta){
        if(!state.selectedComponents.size)return;

        for(const c of state.components){
          if(state.selectedComponents.has(c.id)&&!c.isJunction)
            c.angle=normalizeComponentAngle(c.type,(c.angle||0)+delta);

      function rotateWholeCircuit(){
        if(!state.components.length)return;
        pushHistory();
        let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
        for(const c of state.components){
          const b=componentBounds(c);
          minX=Math.min(minX,b.x1);minY=Math.min(minY,b.y1);
          maxX=Math.max(maxX,b.x2);maxY=Math.max(maxY,b.y2);
        }
        const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
        for(const c of state.components){
          const rp=rotatePoint(c.x-cx,c.y-cy,90);
          c.x=snap(cx+rp.x);c.y=snap(cy+rp.y);c.renderX=c.x;c.renderY=c.y;
          if(!c.isJunction)c.angle=normalizeComponentAngle(c.type,(c.angle||0)+90);
          if(c.labelOffset){
            const lo=rotatePoint(c.labelOffset.x,c.labelOffset.y,90);
            c.labelOffset={x:Math.round(lo.x/4)*4,y:Math.round(lo.y/4)*4};
          }
          if(c.valueLabelOffset){
            const vo=rotatePoint(c.valueLabelOffset.x,c.valueLabelOffset.y,90);

      function initAudio(){
        if(!state.audioCtx){
          const Ctx=window.AudioContext||window.webkitAudioContext;

          state.audioCtx=new Ctx();

        if(state.audioCtx.state==="suspended")state.audioCtx.resume().catch(()=>{});

      function ensureBuzzerSound(c){
        if(!state.audioEnabled)return;
        initAudio();
        if(!state.audioCtx||state.buzzerOscillators.has(c.id))return;
        const osc=state.audioCtx.createOscillator(),gain=state.audioCtx.createGain();
        const trem=state.audioCtx.createOscillator(),tremGain=state.audioCtx.createGain();
        osc.type="square";osc.frequency.value=880;gain.gain.value=0.0001;
        trem.type="sine";trem.frequency.value=9;tremGain.gain.value=0.02;
        trem.connect(tremGain);tremGain.connect(gain.gain);
        osc.connect(gain);gain.connect(state.audioCtx.destination);
        osc.start();trem.start();state.buzzerOscillators.set(c.id,{osc,gain,trem,tremGain});
      }
      function stopBuzzerSound(id){
        const item=state.buzzerOscillators.get(id);if(!item)return;
        try{item.osc.stop()}catch{}
        try{item.trem.stop()}catch{}
        try{item.osc.disconnect()}catch{}
        try{item.gain.disconnect()}catch{}
        try{item.trem.disconnect()}catch{}
        try{item.tremGain.disconnect()}catch{}
        state.buzzerOscillators.delete(id);
      }
      function stopRemovedBuzzers(){
        const valid=new Set(state.components.filter(c=>c.type==="buzzer").map(c=>c.id));
        for(const id of [...state.buzzerOscillators.keys()])if(!valid.has(id))stopBuzzerSound(id);
      }
      function updateAudio(){
        stopRemovedBuzzers();
        for(const c of state.components){
          if(c.type!=="buzzer")continue;
          const p=normalizedPower(c,0.18);
          if(p>0.01){
            ensureBuzzerSound(c);
            const item=state.buzzerOscillators.get(c.id);
            if(item){
              item.osc.frequency.value=650+p*550;
              item.gain.gain.setTargetAtTime(0.01+p*0.05,state.audioCtx.currentTime,0.03);
            }
          }else stopBuzzerSound(c.id);
        }
      }
      function updateMeterExplainCard(){
